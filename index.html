<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON JUMP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #12002a 0%, #0a0015 50%, #000000 100%);
            color: #00fff0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Мрачная неоновая сетка на фоне */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(180, 0, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 0, 255, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridPulse 8s ease-in-out infinite;
        }

        /* Виньетка по краям */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 1; }
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 0 10px #ff2bd6,
                             0 0 25px #ff2bd6,
                             0 0 50px #b400ff;
            }
            50% {
                text-shadow: 0 0 15px #00fff0,
                             0 0 35px #00fff0,
                             0 0 70px #ff2bd6;
            }
        }

        @keyframes borderRun {
            0%   { background-position: 0% 0%, 100% 0%, 100% 100%, 0% 100%; }
            100% { background-position: 100% 0%, 100% 100%, 0% 100%, 0% 0%; }
        }

        @keyframes btnPulse {
            0%, 100% {
                box-shadow: 0 0 15px #ff2bd6,
                            0 0 35px rgba(255, 43, 214, 0.5),
                            inset 0 0 15px rgba(255, 43, 214, 0.2);
            }
            50% {
                box-shadow: 0 0 25px #ff2bd6,
                            0 0 60px rgba(255, 43, 214, 0.8),
                            inset 0 0 25px rgba(255, 43, 214, 0.4);
            }
        }

        h1 {
            position: relative;
            color: #00fff0;
            font-size: clamp(2rem, 8vw, 4.5rem);
            letter-spacing: 8px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff2bd6, 0 0 25px #ff2bd6, 0 0 50px #b400ff;
            animation: titleGlow 3s ease-in-out infinite;
            z-index: 2;
            font-family: 'Courier New', monospace;
        }

        .subtitle {
            position: relative;
            color: #b400ff;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            letter-spacing: 6px;
            margin-bottom: 60px;
            text-shadow: 0 0 10px #b400ff, 0 0 20px #b400ff;
            z-index: 2;
            opacity: 0.85;
        }

        .btn {
            position: relative;
            z-index: 2;
            background: #0a0015;
            border: 2px solid #ff2bd6;
            color: #ff2bd6;
            font-family: 'Courier New', monospace;
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: 900;
            letter-spacing: 4px;
            padding: 18px 55px;
            text-decoration: none;
            border-radius: 4px;
            text-shadow: 0 0 8px #ff2bd6, 0 0 16px #ff2bd6;
            transition: all 0.25s ease;
            cursor: pointer;
            animation: btnPulse 2.5s ease-in-out infinite;
            text-transform: uppercase;
        }

        .btn:hover {
            color: #00fff0;
            border-color: #00fff0;
            text-shadow: 0 0 12px #00fff0, 0 0 28px #00fff0, 0 0 50px #00fff0;
            box-shadow: 0 0 25px #00fff0,
                        0 0 60px rgba(0, 255, 240, 0.8),
                        inset 0 0 25px rgba(0, 255, 240, 0.3);
            transform: translateY(-3px) scale(1.03);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Декоративные неоновые линии по бокам */
        .deco-line {
            position: absolute;
            top: 50%;
            width: 25%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #b400ff, #ff2bd6, transparent);
            box-shadow: 0 0 15px #ff2bd6;
            z-index: 1;
            opacity: 0.7;
        }
        .deco-line.left  { left: 0;  transform: translateY(-50%); }
        .deco-line.right { right: 0; transform: translateY(-50%) scaleX(-1); }

        @media (max-width: 600px) {
            h1 { letter-spacing: 4px; }
            .subtitle { letter-spacing: 3px; margin-bottom: 40px; }
            .btn { padding: 15px 40px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <h1>NEON JUMP</h1>
    <p class="subtitle">// ARCADE EDITION //</p>

    <a href="game.html" class="btn">🎮 ИГРАТЬ</a>

    <div class="deco-line left"></div>
    <div class="deco-line right"></div>
</body>
</html>

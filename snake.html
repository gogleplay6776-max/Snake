<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Rewind: Cyberpunk Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff0055;
            letter-spacing: 2px;
        }
        #game-container {
            position: relative;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #0a0a12;
        }
        canvas {
            display: block;
            background: #080810;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 1rem;
            text-shadow: 0 0 5px #00ffcc;
        }
        .menu-btn {
            background: #111122;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
            margin: 5px;
        }
        .menu-btn:hover {
            background: #00ffcc;
            color: #05050a;
            box-shadow: 0 0 15px #00ffcc;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        input {
            background: #111122;
            border: 2px solid #ff0055;
            color: #fff;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            margin: 10px 0;
            text-align: center;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }
        .skin-card {
            border: 1px solid #00ffcc;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            background: #101020;
            font-size: 0.8rem;
        }
        .skin-card.selected {
            border-color: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNAKE REWIND</h1>
    <div class="ui-panel">
        <div>Уровень: <span id="lvl-val">1</span>/100</div>
        <div>Чешуйки: <span id="money-val">0</span> 🪙</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Главное меню -->
        <div id="main-menu" class="overlay">
            <h2 style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">CYBERPUNK ARENA</h2>
            <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
            <button class="menu-btn" onclick="openShop()">МАГАЗИН СКИНОВ</button>
            <button class="menu-btn" onclick="openCheats()">ЧИТ-КОДЫ</button>
        </div>

        <!-- Меню магазина -->
        <div id="shop-menu" class="overlay hidden">
            <h2 style="color: #ff0055;">МАГАЗИН (Чешуйки: <span id="shop-money">0</span>)</h2>
            <div class="shop-grid" id="shop-grid"></div>
            <button class="menu-btn" onclick="closeShop()">НАЗАД</button>
        </div>

        <!-- Меню читов -->
        <div id="cheats-menu" class="overlay hidden">
            <h2 style="color: #ff0055;">СЕКРЕТНЫЙ ТЕРМИНАЛ</h2>
            <p style="font-size: 0.85rem; color: #aaa; text-align: center; max-width: 300px;">Введите секретный командный код в поле ниже:</p>
            <input type="text" id="cheat-input" placeholder="Введите команду...">
            <button class="menu-btn" onclick="executeCheat()">ВЫПОЛНИТЬ</button>
            <button class="menu-btn" onclick="closeCheats()">НАЗАД</button>
        </div>

        <!-- Меню паузы / конца игры -->
        <div id="game-over-menu" class="overlay hidden">
            <h2 id="game-over-title" style="color: #ff0055;">ИГРА ОКОНЧЕНА</h2>
            <p id="game-over-text">Вы погибли на уровне 1</p>
            <button class="menu-btn" onclick="startGame()">ЗАНОВО</button>
            <button class="menu-btn" onclick="returnToMenu()">В МЕНЮ</button>
        </div>
    </div>

    <div class="controls-hint">Управление: Стрелки / WASD или свайпы по экрану</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let dx = 1;
        let dy = 0;
        let food = { x: 0, y: 0, type: 'apple' };
        let bugs = [];
        let score = 0;
        let level = 1;
        let money = 0;
        let currentSkin = 0;
        let unlockedSkins = {0: true};
        let gameInterval = null;
        let isPaused = true;

        // Полный список из 25 скинов с уникальными названиями и ценами (Радужный — топ за 7500)
        const skinNames = [
            "Глазастик (База)", "Неоновый Укус", "Кибер-Питон", "Токсик", "Плазменный Шнур",
            "Уличный Самурай", "Ночной Сталкер", "Медный Кабель", "Электрический Разряд", "Ржавый Тек",
            "Кибер-Ниндзя", "Лазерный Луч", "Кислотный Дрин", "Глючный Хвост", "Стальной Удав",
            "Овердрайв", "Голограмма", "Цифровой Призрак", "Квантовый Сдвиг", "Мглистый Путь",
            "Тёмный Синдикат", "Импульсный Кнут", "Неоновый Демон", "Ядро Системы", "Радужный (Легенда)"
        ];

        const skins = [];
        for (let i = 0; i < 25; i++) {
            if (i === 0) {
                skins.push({ name: skinNames[i], price: 0, color: '#00ffcc' });
            } else if (i === 24) {
                skins.push({ name: skinNames[i], price: 7500, color: 'rainbow' });
            } else {
                // Цены от 2000 до ~7300, строго меньше радужного
                let price = 2000 + Math.floor((i / 23) * 5300);
                skins.push({ name: skinNames[i], price: price, color: `hsl(${i * 14}, 80%, 50%)` });
            }
        }

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            bugs = [];
            spawnFood();
            updateUI();
        }

        function startGame() {
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            isPaused = false;
            initGame();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function returnToMenu() {
            if (gameInterval) clearInterval(gameInterval);
            isPaused = true;
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function gameLoop() {
            update();
            if (isPaused) return;
            draw();
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver("Стена не прощает ошибок!");
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver("Ты сожрал свой собственный хвост!");
                    return;
                }
            }

            if (level >= 50) {
                for (let bug of bugs) {
                    if (head.x === bug.x && head.y === bug.y) {
                        gameOver("Тебя поймал кибер-жук!");
                        return;
                    }
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                if (level % 5 === 0) {
                    money += 500; // Бонусная шоколадка
                }
                
                score++;
                if (score >= 5) {
                    score = 0;
                    if (level < 100) {
                        level++;
                        setupLevelBugs();
                    } else {
                        gameOver("ПОБЕДА! ПРОЙДЕНЫ ВСЕ 100 УРОВНЕЙ!");
                        return;
                    }
                }
                spawnFood();
            } else {
                snake.pop();
            }

            if (level >= 50 && Math.random() < 0.6) {
                for (let bug of bugs) {
                    if (bug.x < snake[0].x) bug.x++;
                    else if (bug.x > snake[0].x) bug.x--;
                    if (bug.y < snake[0].y) bug.y++;
                    else if (bug.y > snake[0].y) bug.y--;
                }
            }

            updateUI();
        }

        function setupLevelBugs() {
            bugs = [];
            if (level >= 50) {
                let bugCount = Math.floor((level - 50) / 10) + 1;
                for (let i = 0; i < bugCount; i++) {
                    bugs.push({ x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) });
                }
            }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);
            
            if (level % 5 === 0) {
                food.type = 'chocolate';
            } else if (level >= 1 && level <= 19) {
                food.type = 'apple';
            } else if (level >= 21 && level <= 41) {
                food.type = 'banana';
            } else if (level >= 40 && level <= 90) {
                food.type = 'orange';
            } else if (level >= 90 && level <= 100) {
                food.type = 'lemon';
            } else {
                food.type = 'apple';
            }
        }

        function draw() {
            drawBackground();

            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let foodEmoji = '🍎';
            if (food.type === 'chocolate') foodEmoji = '🍫';
            else if (food.type === 'banana') foodEmoji = '🍌';
            else if (food.type === 'orange') foodEmoji = '🍊';
            else if (food.type === 'lemon') foodEmoji = '🍋';

            ctx.fillText(foodEmoji, food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2);

            if (level >= 50) {
                for (let bug of bugs) {
                    ctx.fillText('👾', bug.x * GRID_SIZE + GRID_SIZE/2, bug.y * GRID_SIZE + GRID_SIZE/2);
                }
            }

            for (let i = 0; i < snake.length; i++) {
                if (currentSkin === 24) {
                    ctx.fillStyle = `hsl(${(i * 15 + Date.now() / 20) % 360}, 100%, 50%)`;
                } else {
                    ctx.fillStyle = skins[currentSkin].color;
                }
                ctx.fillRect(snake[i].x * GRID_SIZE + 1, snake[i].y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);

                if (i === 0 && currentSkin === 0) {
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(snake[i].x * GRID_SIZE + 5, snake[i].y * GRID_SIZE + 5, 4, 4);
                    ctx.fillRect(snake[i].x * GRID_SIZE + 11, snake[i].y * GRID_SIZE + 5, 4, 4);
                }
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#080810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#121226';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            if (level >= 25 && level < 50) {
                ctx.strokeStyle = `rgba(0, 255, 204, ${0.1 + Math.sin(Date.now() / 300) * 0.05})`;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
            } else if (level >= 50 && level < 75) {
                ctx.fillStyle = 'rgba(255, 0, 85, 0.03)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (level >= 75) {
                ctx.fillStyle = 'rgba(0, 255, 100, 0.04)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameOver(reason) {
            clearInterval(gameInterval);
            isPaused = true;
            document.getElementById('game-over-title').innerText = "ИГРА ОКОНЧЕНА";
            document.getElementById('game-over-text').innerText = `${reason} Уровень: ${level}`;
            document.getElementById('game-over-menu').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('lvl-val').innerText = level;
            document.getElementById('money-val').innerText = money;
        }

        window.addEventListener('keydown', e => {
            if (isPaused) return;
            if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -1; }
            if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = 1; }
            if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -1; dy = 0; }
            if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = 1; dy = 0; }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', e => {
            if (isPaused) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx === 0) { dx = 1; dy = 0; }
                else if (diffX < 0 && dx === 0) { dx = -1; dy = 0; }
            } else {
                if (diffY > 0 && dy === 0) { dx = 0; dy = 1; }
                else if (diffY < 0 && dy === 0) { dx = 0; dy = -1; }
            }
        });

        function openShop() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('shop-menu').classList.remove('hidden');
            document.getElementById('shop-money').innerText = money;
            renderShop();
        }

        function closeShop() {
            document.getElementById('shop-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            skins.forEach((skin, idx) => {
                const card = document.createElement('div');
                card.className = `skin-card ${currentSkin === idx ? 'selected' : ''}`;
                card.innerHTML = `<strong>${skin.name}</strong><br>${unlockedSkins[idx] ? 'Куплено' : skin.price + ' 🪙'}`;
                card.onclick = () => selectOrBuySkin(idx);
                grid.appendChild(card);
            });
        }

        function selectOrBuySkin(idx) {
            if (unlockedSkins[idx]) {
                currentSkin = idx;
            } else if (money >= skins[idx].price) {
                money -= skins[idx].price;
                unlockedSkins[idx] = true;
                currentSkin = idx;
                document.getElementById('shop-money').innerText = money;
            } else {
                alert("Не хватает чешуек!");
            }
            renderShop();
        }

        function openCheats() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('cheats-menu').classList.remove('hidden');
        }

        function closeCheats() {
            document.getElementById('cheats-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function executeCheat() {
            const val = document.getElementById('cheat-input').value.trim();
            const parts = val.split(' ');
            const cmd = parts[0];
            const arg = parseInt(parts[1]);

            if (cmd === '/give' && parts[1] === 'money' && !isNaN(parseInt(parts[2]))) {
                money += parseInt(parts[2]);
                alert(`Успешно начислено чешуек: ${parts[2]}`);
            } else if (cmd === '/skin' && !isNaN(arg) && arg >= 0 && arg < skins.length) {
                unlockedSkins[arg] = true;
                currentSkin = arg;
                alert(`Скин #${arg} разблокирован и выбран!`);
            } else if (cmd === '/level' && !isNaN(arg) && arg >= 1 && arg <= 100) {
                level = arg;
                setupLevelBugs();
                alert(`Телепортация на уровень ${arg}!`);
            } else {
                alert("Неверная команда или аргументы!");
            }
            document.getElementById('cheat-input').value = '';
            updateUI();
        }
    </script>
</body>
</html>

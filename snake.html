<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake: New Era</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent: #5c7cfa;
            --accent-hover: #4c6ef5;
            --danger: #ff6b6b;
            --success: #51cf66;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 420px;
            width: 92%;
            box-sizing: border-box;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            border: none;
            color: white;
            font-size: 16px;
            padding: 12px 25px;
            margin: 8px 0;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(92, 124, 250, 0.2);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #495057;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .game-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #ffffff;
            border: 3px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: block;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        #terminal-output {
            background: #1a1a1a;
            color: #51cf66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            text-align: left;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .term-input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .term-input-group input {
            margin: 0;
        }

        .term-input-group button {
            width: auto;
            margin: 0;
            padding: 0 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        #bonus-alert {
            color: #e67e22;
            font-weight: bold;
            font-size: 12px;
            height: 16px;
            margin-bottom: 4px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            width: 100%;
            margin: 10px 0;
            padding: 5px;
            box-sizing: border-box;
        }

        .skin-card {
            background: #f8f9fa;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .skin-card:hover {
            border-color: var(--accent);
        }

        .skin-card.selected {
            background: #e7f5ff;
            border-color: var(--accent);
        }

        .skin-card.owned {
            background: #f1f3f5;
        }

        /* Кастомный внутриигровой нотификатор вместо системного алерта */
        #custom-notification {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #gameover-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div id="custom-notification">Не хватает чешуек!</div>

    <!-- 1. Экран авторизации (спрашивает ник каждый раз) -->
    <div id="screen-login" class="screen active">
        <h2>Snake: New Era</h2>
        <p style="color: #64748b; font-size: 14px;">Введите никнейм для входа</p>
        <input type="text" id="login-input" placeholder="Ваш никнейм..." maxlength="15">
        <button class="btn" onclick="loginUser()">Войти</button>
    </div>

    <!-- 2. Главное меню -->
    <div id="screen-main" class="screen">
        <h2>Snake: New Era</h2>
        <div id="user-greeting" style="margin-bottom: 10px; font-weight: 600; color: var(--accent);"></div>
        
        <button class="btn" id="btn-resume-main" onclick="resumeGameFromMenu()" style="display: none; background: var(--success);">▶ Продолжить игру</button>
        <button class="btn" onclick="startNewGame()">🎮 Новая игра</button>
        <button class="btn btn-secondary" onclick="toScreen('screen-shop')">🛒 Магазин скинов (76)</button>
        <button class="btn btn-secondary" onclick="toScreen('screen-terminal')">💻 Терминал</button>
        <button class="btn btn-secondary" id="music-toggle-btn" onclick="toggleMusic()">🎵 Музыка: ВЫКЛ</button>
        <button class="btn btn-secondary" style="color: var(--danger);" onclick="logout()">🚪 Сменить аккаунт</button>
    </div>

    <!-- 3. Игровой экран -->
    <div id="screen-game" class="screen" style="max-width: 380px;">
        <div class="stats-bar">
            <span id="game-lvl">Ур. 1</span>
            <span id="game-scales">🪙 0</span>
        </div>
        <div id="bonus-alert"></div>
        <div class="game-container">
            <canvas id="gameCanvas" width="340" height="340"></canvas>
        </div>
        <p style="font-size: 11px; color: #888; margin: 6px 0;">Свайпай по экрану или жми стрелки/WASD</p>
        <button class="btn btn-secondary" style="margin-top: 2px; padding: 6px; font-size: 14px;" onclick="toScreen('screen-main')">В меню</button>
    </div>

    <!-- Модальное окно проигрыша -->
    <div id="gameover-modal">
        <div class="modal-content">
            <h3 style="color: var(--danger); margin-bottom: 8px;">Ты проиграл!</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Вы врезались в преграду или стену.</p>
            <button class="btn" onclick="resumeGameInPlay()">🪙 Купить сохранение за 500</button>
            <button class="btn btn-secondary" onclick="closeModalAndMenu()">🏠 Выйти в меню</button>
        </div>
    </div>

    <!-- 4. Магазин скинов -->
    <div id="screen-shop" class="screen">
        <h2>Магазин скинов</h2>
        <p id="shop-balance" style="font-size: 13px; color: #64748b; margin: 4px 0;"></p>
        <div class="shop-grid" id="shop-skins-container"></div>
        <button class="btn btn-secondary" onclick="toScreen('screen-main')">В меню</button>
    </div>

    <!-- 5. Терминал -->
    <div id="screen-terminal" class="screen" style="max-width: 380px;">
        <h3 style="margin-bottom: 8px;">Админ-терминал</h3>
        <div id="terminal-output">Консоль активна. Введите /help<br></div>
        
        <div class="term-input-group" id="term-input-box" style="display: none;">
            <input type="text" id="term-input" placeholder="Введите команду..." onkeydown="checkEnter(event)">
            <button class="btn" onclick="runCmd()">➤</button>
        </div>
        
        <div id="term-locked-msg" style="display: none; color: var(--danger); font-size: 13px; margin: 8px 0;">
            🔒 Ввод команд доступен только администраторам.
        </div>

        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="toScreen('screen-main')">В меню</button>
    </div>

<script>
    // --- УВЕДОМЛЕНИЕ БЕЗ АЛЕРТА ---
    function showNotification(text) {
        let note = document.getElementById('custom-notification');
        note.innerText = text;
        note.style.display = 'block';
        setTimeout(() => {
            note.style.display = 'none';
        }, 2000);
    }

    // --- МУЗЫКАЛЬНЫЙ ЭМБИЕНТ ---
    let audioCtx = null;
    let musicActive = false;
    let pianoInterval = null;

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        musicActive = !musicActive;
        let btn = document.getElementById('music-toggle-btn');
        
        if (musicActive) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            btn.innerText = "🎵 Музыка: ВКЛ";
            startPianoAmbient();
        } else {
            btn.innerText = "🎵 Музыка: ВЫКЛ";
            if (pianoInterval) clearInterval(pianoInterval);
        }
    }

    function playPianoNote(freq, duration = 3.5) {
        if (!audioCtx || !musicActive) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function startPianoAmbient() {
        if (pianoInterval) clearInterval(pianoInterval);
        const notes = [196.00, 220.00, 233.08, 261.63, 293.66, 329.63, 349.23, 392.00];
        pianoInterval = setInterval(() => {
            if (!musicActive) return;
            let note1 = notes[Math.floor(Math.random() * notes.length)];
            let note2 = notes[Math.floor(Math.random() * notes.length)];
            playPianoNote(note1, 4.5);
            setTimeout(() => playPianoNote(note2, 5.0), 1200);
        }, 3500);
    }

    // --- БАЗА ДАННЫХ И СЕССИЯ ---
    let db = {
        name: "",
        users: JSON.parse(localStorage.getItem('snake_users_db')) || {
            "ZxC Avgust": { scales: 50000, level: 1, foodEaten: 0, skin: 1, skinsOwned: [1], god: false, banned: false, isAdmin: true }
        }
    };

    // Требуем ввод ника каждый раз при открытии/перезагрузке
    window.onload = function() {
        localStorage.removeItem('snake_current_user');
        toScreen('screen-login');
    };

    function saveDB() {
        localStorage.setItem('snake_users_db', JSON.stringify(db.users));
    }

    function toScreen(id) {
        if (gameInterval && id !== 'screen-game') {
            clearInterval(gameInterval);
            gameInterval = null;
        }
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');

        if (id === 'screen-main') updateMainUI();
        if (id === 'screen-shop') renderShop();
        if (id === 'screen-terminal') checkTerminalAccess();
    }

    function loginUser() {
        let nameInput = document.getElementById('login-input').value.trim();
        if (!nameInput) {
            showNotification('Введите корректный никнейм!');
            return;
        }

        db.name = nameInput;
        if (!db.users[db.name]) {
            db.users[db.name] = {
                scales: 1000,
                level: 1,
                foodEaten: 0,
                skin: 1,
                skinsOwned: [1],
                god: false,
                banned: false,
                isAdmin: (db.name === "ZxC Avgust"),
                savedSnake: null,
                savedDx: 20,
                savedDy: 0
            };
        } else {
            if (!db.users[db.name].skinsOwned) db.users[db.name].skinsOwned = [1];
            if (db.users[db.name].foodEaten === undefined) db.users[db.name].foodEaten = 0;
        }
        saveDB();
        enterMain();
    }

    function enterMain() {
        document.getElementById('user-greeting').innerText = `Игрок: ${db.name} ${db.users[db.name].isAdmin ? '⭐ [Админ]' : ''}`;
        toScreen('screen-main');
    }

    function updateMainUI() {
        let user = db.users[db.name];
        let resumeBtn = document.getElementById('btn-resume-main');
        if (user && user.savedSnake && user.savedSnake.length > 0) {
            resumeBtn.style.display = 'block';
        } else {
            resumeBtn.style.display = 'none';
        }
    }

    function logout() {
        db.name = "";
        localStorage.removeItem('snake_current_user');
        toScreen('screen-login');
    }

    // --- 76 СКИНОВ ---
    const skinNames = {
        1: "Классический зелёный", 2: "Неоновый лайм", 3: "Лесной мох", 4: "Изумрудный блеск", 5: "Травяной пиксель",
        6: "Мятная свежесть", 7: "Оливковый камуфляж", 8: "Небесный сапфир", 9: "Океанская волна", 10: "Ночной синий",
        11: "Небесная лазурь", 12: "Глубокая бездна", 13: "Ледяной кристалл", 14: "Электрический синий", 15: "Королевский индиго",
        16: "Солнечный жёлтый", 17: "Янтарный мёд", 18: "Песчаная буря", 19: "Золотой слиток", 20: "Лимонный взрыв",
        21: "Огненная искра", 22: "Мандариновый фреш", 23: "Раскаленная лава", 24: "Медная ржавчина", 25: "Бронзовый век",
        26: "Стальной клинок", 27: "Серебряный пульс", 28: "Хромированный каркас", 29: "Титановый сплав", 30: "Железный бастион",
        31: "Розовая карамель", 32: "Неоновый фламинго", 33: "Пурпурный туман", 34: "Маджента хакер", 35: "Энергетический заряд",
        36: "Угольный карбон", 37: "Тёмный киберпанк", 38: "Ночной мегаполис", 39: "Синтетический вирус", 40: "Цифровой призрак",
        41: "Фиолетовый бархат", 42: "Аметистовый блеск", 43: "Сумеречный плащ", 44: "Космическая пыль", 45: "Галактический странник",
        46: "Лавандовое поле", 47: "Орхидея", 48: "Черничный джем", 49: "Королевский пурпур", 50: "Глубокий космос",
        51: "Шоколадный трюфель", 52: "Молочный ирис", 53: "Карамельный тоффи", 54: "Кофейное зерно", 55: "Древесная кора",
        56: "Рубиновый кровопийца", 57: "Кровавая луна", 58: "Гранатовый рассвет", 59: "Вишнёвый сад", 60: "Бордовый бархат",
        61: "Кислотный токсин", 62: "Радиоактивный распад", 63: "Ядовитый плевок", 64: "Кибернетическая плазма", 65: "Кислотно-зеленый хаос",
        66: "Жемчужный белый", 67: "Снежная буря", 68: "Арктический призрак", 69: "Лунный свет", 70: "Кристальный алмаз",
        71: "Золотой император", 72: "Платиновый монолит", 73: "Голографический спектр", 74: "Магический артефакт", 75: "Древний божественный",
        76: "🌈 Радужный Легендарный"
    };

    function renderShop() {
        let user = db.users[db.name];
        if (!user.skinsOwned) user.skinsOwned = [1];
        
        document.getElementById('shop-balance').innerText = `Ваши чешуйки: 🪙 ${user.scales}`;
        let container = document.getElementById('shop-skins-container');
        container.innerHTML = '';

        for (let i = 1; i <= 76; i++) {
            let price = (i === 76) ? 1000000 : i * 10000;
            let owned = user.skinsOwned.includes(i);
            let isCurrent = (user.skin === i);
            let sName = skinNames[i] || `Скин #${i}`;

            let card = document.createElement('div');
            card.className = `skin-card ${isCurrent ? 'selected' : ''} ${owned ? 'owned' : ''}`;
            card.innerHTML = `
                <b>#${i} ${sName}</b><br>
                <span style="color: #666; font-size: 10px;">${i === 76 ? '1,000,000 🪙' : (owned ? 'Куплено' : price + ' 🪙')}</span>
            `;

            card.onclick = (function(skinIndex, skinPrice) {
                return function() {
                    let currentUser = db.users[db.name];
                    if (currentUser.skinsOwned.includes(skinIndex)) {
                        currentUser.skin = skinIndex;
                        saveDB();
                        renderShop();
                    } else {
                        if (currentUser.scales >= skinPrice) {
                            currentUser.scales -= skinPrice;
                            currentUser.skinsOwned.push(skinIndex);
                            currentUser.skin = skinIndex;
                            saveDB();
                            renderShop();
                        } else {
                            // Заменили алерт на красивое всплывающее уведомление без блокировки страницы
                            showNotification('Не хватает чешуек!');
                        }
                    }
                };
            })(i, price);

            container.appendChild(card);
        }
    }

    // --- АДМИН-ТЕРМИНАЛ ---
    function checkTerminalAccess() {
        let user = db.users[db.name];
        let inputBox = document.getElementById('term-input-box');
        let lockedMsg = document.getElementById('term-locked-msg');

        if (user && user.isAdmin) {
            inputBox.style.display = 'flex';
            lockedMsg.style.display = 'none';
        } else {
            inputBox.style.display = 'none';
            lockedMsg.style.display = 'block';
        }
    }

    function checkEnter(e) {
        if (e.key === 'Enter') runCmd();
    }

    function runCmd() {
        let inp = document.getElementById('term-input');
        let text = inp.value.trim();
        if (!text) return;

        let out = document.getElementById('terminal-output');
        let user = db.users[db.name];
        let isMainAdmin = (db.name === "ZxC Avgust");

        out.innerHTML += `> ${text}<br>`;
        let p = text.split(' ');
        let cmd = p[0];

        if (!user || !user.isAdmin) {
            out.innerHTML += `<span style="color: var(--danger);">Ошибка: Нет прав администратора.</span><br>`;
        } else {
            if (cmd === '/commands') {
                if (!isMainAdmin) {
                    out.innerHTML += `<span style="color: var(--danger);">Ошибка: Доступно только ZxC Avgust.</span><br>`;
                } else {
                    let action = p[1];
                    let target = p[2];
                    if (target && db.users[target]) {
                        if (action === 'give') {
                            db.users[target].isAdmin = true;
                            out.innerHTML += `<span style="color: var(--success);">Игрок ${target} теперь админ!</span><br>`;
                        } else if (action === 'take') {
                            if (target === "ZxC Avgust") {
                                out.innerHTML += `<span style="color: var(--danger);">Нельзя забрать права у создателя!</span><br>`;
                            } else {
                                db.users[target].isAdmin = false;
                                out.innerHTML += `<span style="color: var(--danger);">У ${target} забраны права.</span><br>`;
                            }
                        }
                        saveDB();
                    } else {
                        out.innerHTML += `Игрок "${target}" не найден.<br>`;
                    }
                }
            } else {
                if (text === '/help') {
                    out.innerHTML += `Команды: /give, /delete, /mode god/deaktive, /level, /skin, /console<br>`;
                } else if (cmd === '/give') {
                    let target = p[2] && !isNaN(p[2]) ? db.name : (p[2] || db.name);
                    let amt = parseInt(p[2] && !isNaN(p[2]) ? p[2] : p[3]) || 1000;
                    if (!db.users[target]) db.users[target] = { scales: 0, level: 1, foodEaten: 0, skin: 1, skinsOwned: [1], god: false, banned: false, isAdmin: false };
                    db.users[target].scales += amt;
                    out.innerHTML += `Выдано ${amt} чешуек -> ${target}.<br>`;
                } else if (cmd === '/delete') {
                    let target = p[2] && !isNaN(p[2]) ? db.name : (p[2] || db.name);
                    let amt = parseInt(p[2] && !isNaN(p[2]) ? p[2] : p[3]) || 1000;
                    if (db.users[target]) {
                        db.users[target].scales = Math.max(0, db.users[target].scales - amt);
                        out.innerHTML += `Списано ${amt} чешуек у ${target}.<br>`;
                    }
                } else if (cmd === '/mode') {
                    if (p[1] === 'god') { user.god = true; out.innerHTML += `Режим Бога ВКЛ.<br>`; }
                    if (p[1] === 'deaktive') { user.god = false; out.innerHTML += `Режим Бога ВЫКЛ.<br>`; }
                } else if (cmd === '/level') {
                    let lvl = parseInt(p[1]);
                    if (lvl >= 1 && lvl <= 200) { user.level = lvl; user.foodEaten = 0; out.innerHTML += `Уровень: ${lvl}<br>`; }
                } else if (cmd === '/skin') {
                    let sk = parseInt(p[1]);
                    if (sk >= 1 && sk <= 76) { user.skin = sk; out.innerHTML += `Скин #${sk} установлен.<br>`; }
                } else if (cmd === '/console') {
                    out.innerHTML += `--- БАЗА ИГРОКОВ ---\n<br>`;
                    for (let usr in db.users) {
                        out.innerHTML += `${usr}: ${db.users[usr].scales} 🪙 (Ур: ${db.users[usr].level})<br>`;
                    }
                }
            }
        }
        saveDB();
        out.scrollTop = out.scrollHeight;
        inp.value = '';
    }

    // --- ИГРОВОЙ ДВИЖОК ---
    let canvas, ctx;
    let gameInterval = null;
    const grid = 20;
    let snake = [];
    let dx = 20, dy = 0;
    let fruit = { x: 0, y: 0, type: 'apple', emoji: '🍎', reward: 100 };
    let obstacles = [];

    // Новая игра строго с 1 уровня и сбросом сохраненной змейки
    function startNewGame() {
        let user = db.users[db.name];
        user.level = 1;
        user.foodEaten = 0;
        user.savedSnake = null;
        saveDB();
        
        snake = [
            { x: 140, y: 140 },
            { x: 120, y: 140 },
            { x: 100, y: 140 }
        ];
        dx = grid;
        dy = 0;
        launchGameSession();
    }

    // Продолжить игру с того места, где остановился
    function resumeGameFromMenu() {
        let user = db.users[db.name];
        if (user && user.savedSnake && user.savedSnake.length > 0) {
            snake = user.savedSnake;
            dx = user.savedDx !== undefined ? user.savedDx : grid;
            dy = user.savedDy !== undefined ? user.savedDy : 0;
        } else {
            snake = [
                { x: 140, y: 140 },
                { x: 120, y: 140 },
                { x: 100, y: 140 }
            ];
            dx = grid;
            dy = 0;
        }
        launchGameSession();
    }

    function resumeGameInPlay() {
        let currentUser = db.users[db.name];
        if (currentUser.scales >= 500) {
            currentUser.scales -= 500;
            saveDB();
            
            document.getElementById('gameover-modal').style.display = 'none';
            snake = [
                { x: 140, y: 140 },
                { x: 120, y: 140 },
                { x: 100, y: 140 }
            ];
            dx = grid;
            dy = 0;
            spawnFruit();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 110);
        } else {
            showNotification('Недостаточно чешуек! Нужно 500 🪙');
        }
    }

    function launchGameSession() {
        toScreen('screen-game');
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');

        spawnFruit();
        generateObstacles();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 110);
    }

    function gameLoop() {
        update();
        draw();
    }

    function update() {
        let currentUser = db.users[db.name];
        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (currentUser.god) {
            if (head.x < 0) head.x = canvas.width - grid;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - grid;
            if (head.y >= canvas.height) head.y = 0;
        } else {
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                triggerGameOver();
                return;
            }
        }

        for (let i = 0; i < snake.length; i++) {
            if (!currentUser.god && head.x === snake[i].x && head.y === snake[i].y) {
                triggerGameOver();
                return;
            }
        }

        for (let obs of obstacles) {
            if (!currentUser.god && head.x === obs.x && head.y === obs.y) {
                triggerGameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === fruit.x && head.y === fruit.y) {
            currentUser.scales += fruit.reward;
            currentUser.foodEaten++;

            // Логика перехода по уровням:
            // На бонусном уровне (каждый 5-й) нужно съесть ровно 2 шоколадки.
            // На обычных уровнях нужно съесть 10 единиц еды.
            let requiredFood = (currentUser.level % 5 === 0) ? 2 : 10;

            if (currentUser.foodEaten >= requiredFood) {
                currentUser.foodEaten = 0;
                if (currentUser.level < 200) currentUser.level++;
                generateObstacles();
            }

            saveDB();
            spawnFruit();
        } else {
            snake.pop();
        }

        currentUser.savedSnake = snake;
        currentUser.savedDx = dx;
        currentUser.savedDy = dy;
        saveDB();

        let requiredFoodDisplay = (currentUser.level % 5 === 0) ? 2 : 10;
        document.getElementById('game-lvl').innerText = `Ур. ${currentUser.level} (${currentUser.foodEaten}/${requiredFoodDisplay})`;
        document.getElementById('game-scales').innerText = `🪙 ${currentUser.scales}`;

        let alertBox = document.getElementById('bonus-alert');
        if (currentUser.level % 5 === 0) {
            alertBox.innerText = `⚡ БОНУСНЫЙ РАУНД! Съешь 2 шоколадки (осталось ${2 - currentUser.foodEaten})`;
        } else {
            alertBox.innerText = `До перехода: ${10 - currentUser.foodEaten} еды`;
        }
    }

    // --- СИСТЕМА ЕДЫ ПО ДИАПАЗОНАМ УРОВНЕЙ ---
    function spawnFruit() {
        let currentUser = db.users[db.name];
        fruit.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
        fruit.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;

        // Каждый 5-й уровень — бонусный раунд (только шоколад по 5000)
        if (currentUser.level % 5 === 0) {
            fruit.type = 'chocolate';
            fruit.emoji = '🍫';
            fruit.reward = 5000;
            return;
        }

        let lvl = currentUser.level;
        let rnd = Math.random();

        if (lvl <= 35) {
            if (rnd < 0.55) { fruit.type = 'apple'; fruit.emoji = '🍎'; fruit.reward = 100; }
            else if (rnd < 0.85) { fruit.type = 'orange'; fruit.emoji = '🍊'; fruit.reward = 250; }
            else { fruit.type = 'grape'; fruit.emoji = '🍇'; fruit.reward = 350; }
        } else if (lvl <= 70) {
            if (rnd < 0.40) { fruit.type = 'orange'; fruit.emoji = '🍊'; fruit.reward = 250; }
            else if (rnd < 0.75) { fruit.type = 'grape'; fruit.emoji = '🍇'; fruit.reward = 350; }
            else { fruit.type = 'watermelon'; fruit.emoji = '🍉'; fruit.reward = 2000; }
        } else if (lvl <= 110) {
            if (rnd < 0.50) { fruit.type = 'watermelon'; fruit.emoji = '🍉'; fruit.reward = 2000; }
            else if (rnd < 0.85) { fruit.type = 'mushroom'; fruit.emoji = '🍄'; fruit.reward = 5000; }
            else { fruit.type = 'universe'; fruit.emoji = '🌌'; fruit.reward = 10000; }
        } else if (lvl <= 160) {
            if (rnd < 0.60) { fruit.type = 'mushroom'; fruit.emoji = '🍄'; fruit.reward = 5000; }
            else { fruit.type = 'universe'; fruit.emoji = '🌌'; fruit.reward = 10000; }
        } else {
            fruit.type = 'universe';
            fruit.emoji = '🌌';
            fruit.reward = 10000;
        }
    }

    function generateObstacles() {
        let currentUser = db.users[db.name];
        obstacles = [];
        let count = currentUser.level % 5 === 0 ? 1 : Math.min(Math.floor(currentUser.level / 10), 8);
        
        for (let i = 0; i < count; i++) {
            obstacles.push({
                x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                y: Math.floor(Math.random() * (canvas.height / grid)) * grid
            });
        }
    }

    function draw() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#f8f9fa";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += grid) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        ctx.fillStyle = "#adb5bd";
        for (let obs of obstacles) {
            ctx.fillRect(obs.x + 2, obs.y + 2, grid - 4, grid - 4);
        }

        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(fruit.emoji, fruit.x + grid / 2, fruit.y + grid / 2 + 1);

        let currentUser = db.users[db.name];
        snake.forEach((part, index) => {
            if (currentUser.skin === 76) {
                ctx.fillStyle = index === 0 ? "#5c7cfa" : `hsl(${Date.now() / 4 + index * 15}, 70%, 60%)`;
            } else {
                ctx.fillStyle = index === 0 ? "#4c6ef5" : "#748ffc";
            }
            ctx.fillRect(part.x + 1, part.y + 1, grid - 2, grid - 2);
        });
    }

    function triggerGameOver() {
        clearInterval(gameInterval);
        gameInterval = null;
        let user = db.users[db.name];
        user.savedSnake = null;
        saveDB();
        document.getElementById('gameover-modal').style.display = 'flex';
    }

    function closeModalAndMenu() {
        document.getElementById('gameover-modal').style.display = 'none';
        toScreen('screen-main');
    }

    // --- УПРАВЛЕНИЕ ---
    document.addEventListener('keydown', e => {
        if (!gameInterval) return;
        if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -grid; dy = 0; }
        if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -grid; }
        if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = grid; dy = 0; }
        if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = grid; }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
        if (!gameInterval) return;
        let t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
    }, { passive: true });

    window.addEventListener('touchmove', e => {
        if (!gameInterval) return;
        if (e.target.tagName === 'CANVAS') {
            e.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('touchend', e => {
        if (!gameInterval) return;
        let t = e.changedTouches[0];
        let diffX = t.clientX - touchStartX;
        let diffY = t.clientY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 25 && dx === 0) { dx = grid; dy = 0; }
            else if (diffX < -25 && dx === 0) { dx = -grid; dy = 0; }
        } else {
            if (diffY > 25 && dy === 0) { dx = 0; dy = grid; }
            else if (diffY < -25 && dy === 0) { dx = 0; dy = -grid; }
        }
    }, { passive: true });
</script>

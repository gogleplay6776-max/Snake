<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Rewind: Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background: #111; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        h1 { margin: 3px 0; font-size: 20px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        #game-container {
            position: relative;
            width: 360px; height: 380px;
            background: #1a1a1a;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            overflow: hidden;
        }
        canvas { display: block; background: #222; }
        .ui-panel {
            display: flex; justify-content: space-between;
            width: 360px; padding: 6px 10px;
            background: #181818; font-size: 13px;
            font-weight: bold; border: 4px solid #333; border-top: none;
        }
        #shop-panel {
            width: 360px; padding: 6px; background: #222;
            border: 4px solid #333; border-top: none;
            display: flex; flex-direction: column; gap: 4px;
            font-size: 12px;
        }
        .shop-row { display: flex; justify-content: space-between; align-items: center; }
        #skin-name { color: #ffcc00; }
        button {
            background: #00ffcc; color: #111; border: none;
            padding: 4px 8px; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:active { background: #009966; }
        .bar-container { width: 360px; display: flex; flex-direction: column; gap: 2px; }
        .bar { width: 100%; height: 5px; background: #444; display: none; }
        .bar-fill { width: 100%; height: 100%; transition: width 0.2s; }
        #boss-hp-fill { background: #ff0055; }
    </style>
</head>
<body>

    <h1>SNAKE REWIND</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="380"></canvas>
    </div>
    <div class="ui-panel">
        <div>Счет: <span id="scoreVal">0</span> | Уровень: <span id="levelVal">1</span></div>
        <div>Монеты: <span id="coinsVal">0</span></div>
    </div>
    <div id="shop-panel">
        <div class="shop-row">
            <div>Скин: <span id="skin-name">Кибер-Гадюка 2077</span></div>
            <button onclick="buyOrSelectSkin()">Выбрать / Купить (50 монет)</button>
        </div>
        <div class="shop-row" style="font-size: 11px; color: #888;">
            Статус: <span id="skin-status" style="color: #00ffcc;">Куплен</span>
        </div>
    </div>
    <div class="bar-container" style="width: 360px;">
        <div class="bar" id="boss-hp-bar"><div class="bar-fill" id="boss-hp-fill"></div></div>
    </div>

    <!-- Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDMInRuBDgKFRzj68br7C...",
        authDomain: "snake-rewind-11ee6.firebaseapp.com",
        projectId: "snake-rewind-11ee6",
        storageBucket: "snake-rewind-11ee6.firebasestorage.app",
        messagingSenderId: "786857506320",
        appId: "1:786857506320:web:55296c8798..."
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.saveScore = async function(playerName, score) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: playerName,
            score: score,
            date: new Date()
          });
          console.log("Рекорд улетел в базу нахуй!");
        } catch (e) {
          console.error("Ошибка сохранения: ", e);
        }
      };
    </script>

    <!-- Игровая логика -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreVal = document.getElementById("scoreVal");
        const levelVal = document.getElementById("levelVal");
        const coinsVal = document.getElementById("coinsVal");
        const skinNameDisplay = document.getElementById("skin-name");
        const skinStatusDisplay = document.getElementById("skin-status");
        const bossHpBar = document.getElementById("boss-hp-bar");
        const bossHpFill = document.getElementById("boss-hp-fill");

        const gridSize = 15;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        // 50 скинов, включая твой фирменный радужный!
        const skins = [
            { name: "Кибер-Гадюка 2077", color: "#00ffcc", price: 0, unlocked: true },
            { name: "Радужный Брат (Фирменный)", color: "rainbow", price: 0, unlocked: true },
            { name: "Токсичный Урод", color: "#39ff14", price: 50, unlocked: false },
            { name: "Ржавая Арматура", color: "#b87333", price: 50, unlocked: false },
            { name: "Золотой Унитаз", color: "#ffd700", price: 100, unlocked: false },
            { name: "Ночной Кошмар", color: "#222222", price: 50, unlocked: false },
            { name: "Кровавый Замес", color: "#ff0033", price: 75, unlocked: false },
            { name: "Уличный Беспредел", color: "#ff00ff", price: 75, unlocked: false },
            { name: "Пиксельный Оплот", color: "#00ffff", price: 50, unlocked: false },
            { name: "Атомный Блядство", color: "#ccff00", price: 75, unlocked: false },
            { name: "Ледяной Хуй", color: "#00bfff", price: 50, unlocked: false },
            { name: "Теневой Фантом", color: "#555555", price: 50, unlocked: false },
            { name: "Лава-Хруст", color: "#ff4500", price: 100, unlocked: false },
            { name: "Кирпичная Стена", color: "#8b4513", price: 50, unlocked: false },
            { name: "Неоновый Псих", color: "#ff1493", price: 100, unlocked: false },
            { name: "Металлический Бес", color: "#c0c0c0", price: 75, unlocked: false },
            { name: "Грязный Подвал", color: "#808000", price: 50, unlocked: false },
            { name: "Космический Мусор", color: "#9932cc", price: 100, unlocked: false },
            { name: "Электрический Разряд", color: "#1e90ff", price: 75, unlocked: false },
            { name: "Кибер-Глаз", color: "#00fa9a", price: 75, unlocked: false },
            // Остальные скины (до 50)
            ...Array.from({length: 30}, (_, i) => ({
                name: `Скин #${i + 21}`,
                color: `#${Math.floor(Math.random()*16777215).toString(16)}`,
                price: 150,
                unlocked: false
            }))
        ];

        let currentSkinIndex = 0;
        let coins = 100; // Стартовый бонус на покупку скинов
        let score = 0;
        let level = 1;
        
        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 5, y: 5};
        let obstacles = []; // На 1 уровне пусто, добавляются с ростом уровней
        let gameMode = 'play';
        let boss = null;
        let bossProjectiles = [];

        let touchStartX = 0, touchStartY = 0;

        function updateSkinUI() {
            let skin = skins[currentSkinIndex];
            skinNameDisplay.innerText = skin.name;
            if (skin.color === "rainbow") {
                skinNameDisplay.style.color = "#ff00ff";
            } else {
                skinNameDisplay.style.color = skin.color;
            }

            if (skin.unlocked) {
                skinStatusDisplay.innerText = "Куплен (Активен)";
                skinStatusDisplay.style.color = "#00ffcc";
            } else {
                skinStatusDisplay.innerText = `Цена: ${skin.price} монет`;
                skinStatusDisplay.style.color = "#ffcc00";
            }
            coinsVal.innerText = coins;
        }

        function buyOrSelectSkin() {
            let skin = skins[currentSkinIndex];
            if (skin.unlocked) {
                // Уже куплен, просто выбран
                console.log("Скин активен");
            } else {
                if (coins >= skin.price) {
                    coins -= skin.price;
                    skin.unlocked = true;
                    updateSkinUI();
                    alert(`Красава! Ты купил скин "${skin.name}" нахуй!`);
                } else {
                    alert("Мало монет, блять! Жри еду и побеждай босса!");
                }
            }
        }

        function nextSkin() {
            currentSkinIndex = (currentSkinIndex + 1) % skins.length;
            updateSkinUI();
        }

        // Переключение свайпами (кнопка смены скина через клик по интерфейсу магазина)
        document.getElementById('shop-panel').addEventListener('click', (e) => {
            if(e.target.tagName !== 'BUTTON') {
                nextSkin();
            }
        });

        // Управление
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && velocity.x === 0) velocity = {x: 1, y: 0};
                else if (dx < -30 && velocity.x === 0) velocity = {x: -1, y: 0};
            } else {
                if (dy > 30 && velocity.y === 0) velocity = {x: 0, y: 1};
                else if (dy < -30 && velocity.y === 0) velocity = {x: 0, y: -1};
            }
        });
        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': if(velocity.y === 0) velocity = {x:0, y:-1}; break;
                case 'ArrowDown': if(velocity.y === 0) velocity = {x:0, y:1}; break;
                case 'ArrowLeft': if(velocity.x === 0) velocity = {x:-1, y:0}; break;
                case 'ArrowRight': if(velocity.x === 0) velocity = {x:1, y:0}; break;
            }
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
        }

        function addObstacleForLevel() {
            // Добавляем по 2 кирпича с каждым новым уровнем
            for(let i=0; i<2; i++) {
                obstacles.push({
                    x: Math.floor(Math.random() * tileCountX),
                    y: Math.floor(Math.random() * tileCountY)
                });
            }
        }

        function triggerBossFight() {
            gameMode = 'boss';
            bossHpBar.style.display = 'block';
            boss = { x: 10, y: 3, width: 4, height: 2, hp: 100, maxHp: 100, dir: 1, shootTimer: 0 };
            bossProjectiles = [];
        }

        function update() {
            if (velocity.x === 0 && velocity.y === 0) return;

            let head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            // Стены
            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                resetGame();
                return;
            }

            // Препятствия уровня
            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) { resetGame(); return; }
            }

            // Самоубийство
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) { resetGame(); return; }
            }

            // Столкновение со снарядами босса
            if (gameMode === 'boss') {
                for (let p of bossProjectiles) {
                    if (head.x === p.x && head.y === p.y) {
                        resetGame(); // Босс нанес урон по нам!
                        return;
                    }
                }
            }

            snake.unshift(head);

            if (gameMode === 'play') {
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    coins += 5;
                    scoreVal.innerText = score;
                    updateSkinUI();
                    spawnFood();

                    // Каждые 40 очков — новый уровень и усложнение препятствий
                    if (score > 0 && score % 40 === 0) {
                        level++;
                        levelVal.innerText = level;
                        addObstacleForLevel();
                    }

                    // Каждые 80 очков — боссфайт
                    if (score > 0 && score % 80 === 0) {
                        triggerBossFight();
                    }
                } else {
                    snake.pop();
                }
            } else if (gameMode === 'boss' && boss) {
                // Босс движется
                boss.x += boss.dir * 0.3;
                if (boss.x <= 1 || boss.x >= tileCountX - 5) boss.dir *= -1;

                // Босс стреляет снарядами В ИГРОКА (босс наносит урон!)
                boss.shootTimer++;
                if (boss.shootTimer % 15 === 0) {
                    bossProjectiles.push({
                        x: Math.floor(boss.x + boss.width / 2),
                        y: boss.y + boss.height
                    });
                }

                // Движение снарядов босса вниз
                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    bossProjectiles[i].y += 0.8;
                    if (bossProjectiles[i].y > tileCountY) {
                        bossProjectiles.splice(i, 1);
                    }
                }

                // Удар змейкой по боссу (мы наносим урон боссу снизу)
                let hitBoss = false;
                for (let bx = Math.floor(boss.x); bx < Math.floor(boss.x) + boss.width; bx++) {
                    if (head.x === bx && head.y === boss.y + boss.height) {
                        hitBoss = true;
                    }
                }

                if (hitBoss) {
                    boss.hp -= 20;
                    bossHpFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
                    snake.pop();

                    if (boss.hp <= 0) {
                        // Победа над боссом
                        gameMode = 'play';
                        boss = null;
                        bossProjectiles = [];
                        bossHpBar.style.display = 'none';
                        score += 50;
                        coins += 30;
                        scoreVal.innerText = score;
                        updateSkinUI();
                        spawnFood();
                    }
                } else {
                    if (head.x === food.x && head.y === food.y) {
                        score += 10;
                        coins += 5;
                        scoreVal.innerText = score;
                        updateSkinUI();
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Препятствия уровня
            ctx.fillStyle = "#8b4513";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize - 1, gridSize - 1);
            }

            // Еда
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

            // Змейка со скинами (включая радужный режим)
            let activeSkin = skins[currentSkinIndex];
            for (let i = 0; i < snake.length; i++) {
                let part = snake[i];
                if (activeSkin.color === "rainbow") {
                    ctx.fillStyle = `hsl(${(i * 20 + Date.now() / 20) % 360}, 100%, 50%)`;
                } else {
                    ctx.fillStyle = activeSkin.color;
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
            }

            // Босс
            if (gameMode === 'boss' && boss) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(boss.x * gridSize, boss.y * gridSize, boss.width * gridSize, boss.height * gridSize);

                // Снаряды босса (которые летят в нас!)
                ctx.fillStyle = "#ff0000";
                for (let p of bossProjectiles) {
                    ctx.fillRect(p.x * gridSize, p.y * gridSize, gridSize - 2, gridSize - 2);
                }
            }
        }

        function resetGame() {
            if (window.saveScore && score > 0) {
                window.saveScore("Игрок", score);
            }
            score = 0;
            level = 1;
            obstacles = [];
            scoreVal.innerText = score;
            levelVal.innerText = level;
            snake = [{x: 10, y: 10}];
            velocity = {x: 0, y: 0};
            gameMode = 'play';
            boss = null;
            bossProjectiles = [];
            bossHpBar.style.display = 'none';
            spawnFood();
            updateSkinUI();
        }

        spawnFood();
        updateSkinUI();
        setInterval(() => {
            update();
            draw();
        }, 90);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake: New Era</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent: #5c7cfa;
            --accent-hover: #4c6ef5;
            --danger: #ff6b6b;
            --success: #51cf66;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            border: none;
            color: white;
            font-size: 16px;
            padding: 12px 25px;
            margin: 8px 0;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(92, 124, 250, 0.2);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #495057;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        /* Игровое поле */
        canvas {
            background: #ffffff;
            border: 3px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: block;
            margin: 0 auto;
        }

        #terminal-output {
            background: #1a1a1a;
            color: #51cf66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            text-align: left;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .term-input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .term-input-group input {
            margin: 0;
        }

        .term-input-group button {
            width: auto;
            margin: 0;
            padding: 0 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Сетка скинов в магазине */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            width: 100%;
            margin: 15px 0;
            padding: 5px;
        }

        .skin-card {
            background: #f8f9fa;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .skin-card:hover {
            border-color: var(--accent);
        }

        .skin-card.selected {
            background: #e7f5ff;
            border-color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. Экран авторизации -->
    <div id="screen-login" class="screen active">
        <h2>Snake: New Era</h2>
        <p style="color: #64748b; font-size: 14px;">Введите никнейм для входа в аккаунт</p>
        <input type="text" id="login-input" placeholder="Ваш никнейм..." maxlength="15">
        <button class="btn" onclick="loginUser()">Войти / Создать</button>
    </div>

    <!-- 2. Главное меню -->
    <div id="screen-main" class="screen">
        <h2>Snake: New Era</h2>
        <div id="user-greeting" style="margin-bottom: 15px; font-weight: 600; color: var(--accent);"></div>
        <button class="btn" onclick="startGame()">🎮 Играть</button>
        <button class="btn btn-secondary" onclick="toScreen('screen-shop')">🛒 Магазин скинов (76)</button>
        <button class="btn btn-secondary" onclick="toScreen('screen-terminal')">💻 Терминал</button>
        <button class="btn btn-secondary" id="music-toggle-btn" onclick="toggleMusic()">🎵 Музыка: ВЫКЛ</button>
        <button class="btn btn-secondary" style="color: var(--danger);" onclick="logout()">🚪 Сменить аккаунт</button>
    </div>

    <!-- 3. Игровой экран -->
    <div id="screen-game" class="screen" style="max-width: 480px;">
        <div class="stats-bar">
            <span id="game-lvl">Ур. 1</span>
            <span id="game-scales">🍏 0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="toScreen('screen-main')">В меню</button>
    </div>

    <!-- 4. Магазин скинов -->
    <div id="screen-shop" class="screen">
        <h2>Магазин скинов</h2>
        <p id="shop-balance" style="font-size: 14px; color: #64748b;"></p>
        <div class="shop-grid" id="shop-skins-container"></div>
        <button class="btn btn-secondary" onclick="toScreen('screen-main')">В меню</button>
    </div>

    <!-- 5. Терминал -->
    <div id="screen-terminal" class="screen" style="max-width: 480px;">
        <h3 style="margin-bottom: 10px;">Админ-терминал</h3>
        <div id="terminal-output">Консоль активна. Введите /help<br></div>
        
        <div class="term-input-group" id="term-input-box" style="display: none;">
            <input type="text" id="term-input" placeholder="Введите команду..." onkeydown="checkEnter(event)">
            <button class="btn" onclick="runCmd()">➤</button>
        </div>
        
        <div id="term-locked-msg" style="display: none; color: var(--danger); font-size: 13px; margin: 10px 0;">
            🔒 Ввод команд доступен только администраторам.
        </div>

        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="toScreen('screen-main')">В меню</button>
    </div>

<script>
    // --- АУДИО-ЭМБИЕНТ (Пианино / Эмбиент Web Audio API) ---
    let audioCtx = null;
    let musicActive = false;
    let pianoInterval = null;

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        musicActive = !musicActive;
        let btn = document.getElementById('music-toggle-btn');
        
        if (musicActive) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            btn.innerText = "🎵 Музыка: ВКЛ";
            startPianoAmbient();
        } else {
            btn.innerText = "🎵 Музыка: ВЫКЛ";
            if (pianoInterval) clearInterval(pianoInterval);
        }
    }

    function playPianoNote(freq, duration = 3) {
        if (!audioCtx || !musicActive) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function startPianoAmbient() {
        if (pianoInterval) clearInterval(pianoInterval);
        const notes = [220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 523.25]; // Минорный лад
        
        pianoInterval = setInterval(() => {
            if (!musicActive) return;
            let note1 = notes[Math.floor(Math.random() * notes.length)];
            let note2 = notes[Math.floor(Math.random() * notes.length)];
            
            playPianoNote(note1, 4.0);
            setTimeout(() => playPianoNote(note2, 4.5), 1400);
        }, 4000);
    }

    // --- БАЗА ДАННЫХ И СЕССИЯ ---
    let db = {
        name: localStorage.getItem('snake_current_user') || "",
        users: JSON.parse(localStorage.getItem('snake_users_db')) || {
            "ZxC Avgust": { scales: 50000, level: 1, skin: 1, skinsOwned: [1], god: false, banned: false, isAdmin: true }
        }
    };

    window.onload = function() {
        if (db.name && db.users[db.name]) {
            enterMain();
        } else {
            toScreen('screen-login');
        }
    };

    function saveDB() {
        localStorage.setItem('snake_current_user', db.name);
        localStorage.setItem('snake_users_db', JSON.stringify(db.users));
    }

    function toScreen(id) {
        if (gameInterval && id !== 'screen-game') {
            clearInterval(gameInterval);
            gameInterval = null;
        }

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');

        if (id === 'screen-shop') {
            renderShop();
        }
        if (id === 'screen-terminal') {
            checkTerminalAccess();
        }
    }

    function loginUser() {
        let nameInput = document.getElementById('login-input').value.trim();
        if (!nameInput) {
            alert('Введите корректный никнейм!');
            return;
        }

        db.name = nameInput;
        if (!db.users[db.name]) {
            db.users[db.name] = {
                scales: 1000,
                level: 1,
                skin: 1,
                skinsOwned: [1],
                god: false,
                banned: false,
                isAdmin: (db.name === "ZxC Avgust")
            };
        }
        saveDB();
        enterMain();
    }

    function enterMain() {
        document.getElementById('user-greeting').innerText = `Игрок: ${db.name} ${db.users[db.name].isAdmin ? '⭐ [Админ]' : ''}`;
        toScreen('screen-main');
    }

    function logout() {
        db.name = "";
        localStorage.removeItem('snake_current_user');
        toScreen('screen-login');
    }

    // --- МАГАЗИН СКИНОВ (Все 76 штук) ---
    function renderShop() {
        let user = db.users[db.name];
        document.getElementById('shop-balance').innerText = `Ваши чешуйки: 🍏 ${user.scales}`;
        let container = document.getElementById('shop-skins-container');
        container.innerHTML = '';

        for (let i = 1; i <= 76; i++) {
            let price = (i === 76) ? 1000000 : i * 10000;
            let owned = user.skinsOwned.includes(i);
            let isCurrent = (user.skin === i);

            let card = document.createElement('div');
            card.className = `skin-card ${isCurrent ? 'selected' : ''}`;
            card.innerHTML = `
                <b>#${i}</b><br>
                ${i === 76 ? '🌈 Радужный' : (owned ? 'Куплено' : price + ' 🍏')}
            `;

            card.onclick = function() {
                if (owned) {
                    user.skin = i;
                    saveDB();
                    renderShop();
                } else {
                    if (user.scales >= price) {
                        user.scales -= price;
                        user.skinsOwned.push(i);
                        user.skin = i;
                        saveDB();
                        renderShop();
                    } else {
                        alert('Не хватает чешуек!');
                    }
                }
            };
            container.appendChild(card);
        }
    }

    // --- ПРАВА И ТЕРМИНАЛ ---
    function checkTerminalAccess() {
        let user = db.users[db.name];
        let inputBox = document.getElementById('term-input-box');
        let lockedMsg = document.getElementById('term-locked-msg');

        if (user && user.isAdmin) {
            inputBox.style.display = 'flex';
            lockedMsg.style.display = 'none';
        } else {
            inputBox.style.display = 'none';
            lockedMsg.style.display = 'block';
        }
    }

    function checkEnter(e) {
        if (e.key === 'Enter') runCmd();
    }

    function runCmd() {
        let inp = document.getElementById('term-input');
        let text = inp.value.trim();
        if (!text) return;

        let out = document.getElementById('terminal-output');
        let user = db.users[db.name];
        let isMainAdmin = (db.name === "ZxC Avgust");

        out.innerHTML += `> ${text}<br>`;
        let p = text.split(' ');
        let cmd = p[0];

        if (!user || !user.isAdmin) {
            out.innerHTML += `<span style="color: var(--danger);">Ошибка: Нет прав администратора.</span><br>`;
        } else {
            if (cmd === '/commands') {
                if (!isMainAdmin) {
                    out.innerHTML += `<span style="color: var(--danger);">Ошибка: Команда /commands доступна только ZxC Avgust.</span><br>`;
                } else {
                    let action = p[1];
                    let target = p[2];
                    if (target && db.users[target]) {
                        if (action === 'give') {
                            db.users[target].isAdmin = true;
                            out.innerHTML += `<span style="color: var(--success);">Игрок ${target} назначен админом!</span><br>`;
                        } else if (action === 'take' || action === 'revoke') {
                            if (target === "ZxC Avgust") {
                                out.innerHTML += `<span style="color: var(--danger);">Нельзя забрать права у главного создателя!</span><br>`;
                            } else {
                                db.users[target].isAdmin = false;
                                out.innerHTML += `<span style="color: var(--danger);">У игрока ${target} забраны права админа.</span><br>`;
                            }
                        } else {
                            out.innerHTML += `Использование: /commands give [ник] или /commands take [ник]<br>`;
                        }
                        saveDB();
                    } else {
                        out.innerHTML += `Ошибка: Игрок "${target}" не найден.<br>`;
                    }
                }
            } else {
                if (text === '/help') {
                    out.innerHTML += `Команды: /give, /delete, /mode god/deaktive, /level [1-200], /skin [1-76], /console<br>`;
                } else if (cmd === '/give') {
                    let target = p[2] && !isNaN(p[2]) === false ? p[2] : db.name;
                    let amt = parseInt(p[2] && !isNaN(p[2]) ? p[2] : p[3]) || 1000;
                    if (!db.users[target]) db.users[target] = { scales: 0, level: 1, skin: 1, skinsOwned: [1], god: false, banned: false, isAdmin: false };
                    db.users[target].scales += amt;
                    out.innerHTML += `Выдано ${amt} чешуек -> ${target}.<br>`;
                } else if (cmd === '/delete') {
                    let target = p[2] && !isNaN(p[2]) === false ? p[2] : db.name;
                    let amt = parseInt(p[2] && !isNaN(p[2]) ? p[2] : p[3]) || 1000;
                    if (db.users[target]) {
                        db.users[target].scales = Math.max(0, db.users[target].scales - amt);
                        out.innerHTML += `Удалено ${amt} чешуек у ${target}.<br>`;
                    }
                } else if (cmd === '/mode') {
                    if (p[1] === 'god') { user.god = true; out.innerHTML += `Режим Бога ВКЛ.<br>`; }
                    if (p[1] === 'deaktive') { user.god = false; out.innerHTML += `Режим Бога ВЫКЛ.<br>`; }
                } else if (cmd === '/level') {
                    let lvl = parseInt(p[1]);
                    if (lvl >= 1 && lvl <= 200) {
                        user.level = lvl;
                        out.innerHTML += `Уровень изменен на ${lvl}.<br>`;
                    } else {
                        out.innerHTML += `Укажите уровень от 1 до 200.<br>`;
                    }
                } else if (cmd === '/skin') {
                    let sk = parseInt(p[1]);
                    if (sk >= 1 && sk <= 76) {
                        user.skin = sk;
                        out.innerHTML += `Установлен скин №${sk}.<br>`;
                    } else {
                        out.innerHTML += `Скины доступны от 1 до 76.<br>`;
                    }
                } else if (cmd === '/console') {
                    out.innerHTML += `--- БАЗА ИГРОКОВ ---\n<br>`;
                    for (let usr in db.users) {
                        out.innerHTML += `${usr}: ${db.users[usr].scales} чешуек (Ур: ${db.users[usr].level}, Админ: ${db.users[usr].isAdmin ? 'Да' : 'Нет'})<br>`;
                    }
                } else {
                    out.innerHTML += `Неизвестная команда. Введите /help<br>`;
                }
            }
        }

        saveDB();
        out.scrollTop = out.scrollHeight;
        inp.value = '';
    }

    // --- ИГРОВОЙ ДВИЖОК ---
    let canvas, ctx;
    let gameInterval = null;
    const grid = 20;
    let snake = [];
    let dx = grid, dy = 0;
    let fruit = { x: 0, y: 0, type: 'apple', reward: 100 };
    let obstacles = [];

    function startGame() {
        toScreen('screen-game');
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        
        snake = [
            { x: 160, y: 160 },
            { x: 140, y: 160 },
            { x: 120, y: 160 }
        ];
        dx = grid;
        dy = 0;

        spawnFruit();
        generateObstacles();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
        update();
        draw();
    }

    function update() {
        let currentUser = db.users[db.name];
        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (currentUser.god) {
            if (head.x < 0) head.x = canvas.width - grid;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - grid;
            if (head.y >= canvas.height) head.y = 0;
        } else {
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }
        }

        for (let i = 0; i < snake.length; i++) {
            if (!currentUser.god && head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        for (let obs of obstacles) {
            if (!currentUser.god && head.x === obs.x && head.y === obs.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === fruit.x && head.y === fruit.y) {
            currentUser.scales += fruit.reward;
            if (currentUser.level < 200) currentUser.level++;
            saveDB();
            spawnFruit();
            generateObstacles();
        } else {
            snake.pop();
        }

        document.getElementById('game-lvl').innerText = `Ур. ${currentUser.level}`;
        document.getElementById('game-scales').innerText = `🍏 ${currentUser.scales}`;
    }

    function spawnFruit() {
        let currentUser = db.users[db.name];
        fruit.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
        fruit.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;

        if (currentUser.level % 5 === 0) {
            fruit.type = 'chocolate';
            fruit.reward = 5000;
        } else if (currentUser.level <= 25) {
            fruit.type = 'apple';
            fruit.reward = 100;
        } else if (currentUser.level <= 50) {
            fruit.type = 'lemon';
            fruit.reward = 1500;
        } else if (currentUser.level <= 75) {
            fruit.type = 'orange';
            fruit.reward = 5000;
        } else if (currentUser.level <= 100) {
            fruit.type = 'grape';
            fruit.reward = 12000;
        } else if (currentUser.level <= 150) {
            fruit.type = 'watermelon';
            fruit.reward = 25000;
        } else {
            fruit.type = 'mushroom';
            fruit.reward = 50000;
        }
    }

    function generateObstacles() {
        let currentUser = db.users[db.name];
        obstacles = [];
        let count = currentUser.level % 5 === 0 ? 1 : Math.min(Math.floor(currentUser.level / 10), 12);
        
        for (let i = 0; i < count; i++) {
            obstacles.push({
                x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                y: Math.floor(Math.random() * (canvas.height / grid)) * grid
            });
        }
    }

    function draw() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#f1f3f5";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += grid) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        ctx.fillStyle = "#ced4da";
        for (let obs of obstacles) {
            ctx.fillRect(obs.x + 2, obs.y + 2, grid - 4, grid - 4);
        }

        if (fruit.type === 'chocolate') {
            ctx.fillStyle = "#865e3c";
        } else if (fruit.type === 'apple') {
            ctx.fillStyle = "#ff6b6b";
        } else if (fruit.type === 'lemon') {
            ctx.fillStyle = "#fcc419";
        } else if (fruit.type === 'orange') {
            ctx.fillStyle = "#ff922b";
        } else if (fruit.type === 'grape') {
            ctx.fillStyle = "#ae3ec9";
        } else {
            ctx.fillStyle = "#20c997";
        }
        ctx.fillRect(fruit.x + 3, fruit.y + 3, grid - 6, grid - 6);

        let currentUser = db.users[db.name];
        snake.forEach((part, index) => {
            if (currentUser.skin === 76) {
                ctx.fillStyle = index === 0 ? "#5c7cfa" : `hsl(${Date.now() / 5 + index * 15}, 70%, 60%)`;
            } else {
                ctx.fillStyle = index === 0 ? "#4c6ef5" : "#748ffc";
            }
            ctx.fillRect(part.x + 1, part.y + 1, grid - 2, grid - 2);
        });
    }

    function gameOver() {
        clearInterval(gameInterval);
        gameInterval = null;
        alert('Игра окончена! Возвращаемся в меню.');
        toScreen('screen-main');
    }

    document.addEventListener('keydown', e => {
        if (!gameInterval) return;
        if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -grid; dy = 0; }
        if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -grid; }
        if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = grid; dy = 0; }
        if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = grid; }
    });
</script>

</body>
</html>

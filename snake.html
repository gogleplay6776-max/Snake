<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Rewind: 50 Skins Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background: #111; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 22px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        #game-container {
            position: relative;
            width: 360px; height: 420px;
            background: #1a1a1a;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            overflow: hidden;
        }
        canvas { display: block; background: #222; }
        .ui-panel {
            display: flex; justify-content: space-between;
            width: 360px; padding: 8px 10px;
            background: #181818; font-size: 14px;
            font-weight: bold; border: 4px solid #333; border-top: none;
        }
        #skin-panel {
            width: 360px; padding: 6px; background: #222;
            border: 4px solid #333; border-top: none;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px;
        }
        #skin-name { color: #ffcc00; }
        button {
            background: #00ffcc; color: #111; border: none;
            padding: 4px 8px; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:active { background: #009966; }
        #boss-hp-bar {
            width: 100%; height: 6px; background: #444;
            margin-top: 4px; display: none;
        }
        #boss-hp-fill {
            width: 100%; height: 100%; background: #ff0055;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

    <h1>SNAKE REWIND</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="420"></canvas>
    </div>
    <div class="ui-panel">
        <div>Счет: <span id="scoreVal">0</span></div>
        <div>Рекорд: <span id="highScoreVal">0</span></div>
    </div>
    <div id="skin-panel">
        <div>Скин: <span id="skin-name">Кибер-Гадюка 2077</span></div>
        <button onclick="nextSkin()">Сменить скин</button>
    </div>
    <div style="width: 360px;">
        <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>

    <!-- Firebase скрипты -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDMInRuBDgKFRzj68br7C...",
        authDomain: "snake-rewind-11ee6.firebaseapp.com",
        projectId: "snake-rewind-11ee6",
        storageBucket: "snake-rewind-11ee6.firebasestorage.app",
        messagingSenderId: "786857506320",
        appId: "1:786857506320:web:55296c8798..."
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.saveScore = async function(playerName, score) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: playerName,
            score: score,
            date: new Date()
          });
          console.log("Рекорд успешно улетел в базу, блять!");
        } catch (e) {
          console.error("Ошибка сохранения рекорда: ", e);
        }
      };
    </script>

    <!-- Игровая логика и 50 скинов -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreVal = document.getElementById("scoreVal");
        const highScoreVal = document.getElementById("highScoreVal");
        const skinNameDisplay = document.getElementById("skin-name");
        const bossHpBar = document.getElementById("boss-hp-bar");
        const bossHpFill = document.getElementById("boss-hp-fill");

        const gridSize = 15;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        // База из 50 скинов (цвета и названия)
        const skins = [
            { name: "Кибер-Гадюка 2077", color: "#00ffcc" },
            { name: "Токсичный Урод", color: "#39ff14" },
            { name: "Ржавая Арматура", color: "#b87333" },
            { name: "Золотой Унитаз", color: "#ffd700" },
            { name: "Ночной Кошмар", color: "#222222" },
            { name: "Кровавый Замес", color: "#ff0033" },
            { name: "Уличный Беспредел", color: "#ff00ff" },
            { name: "Пиксельный Оплот", color: "#00ffff" },
            { name: "Атомный Блядство", color: "#ccff00" },
            { name: "Ледяной Хуй", color: "#00bfff" },
            { name: "Теневой Фантом", color: "#555555" },
            { name: "Лава-Хруст", color: "#ff4500" },
            { name: "Кирпичная Стена", color: "#8b4513" },
            { name: "Неоновый Псих", color: "#ff1493" },
            { name: "Металлический Бес", color: "#c0c0c0" },
            { name: "Грязный Подвал", color: "#808000" },
            { name: "Космический Мусор", color: "#9932cc" },
            { name: "Электрический Разряд", color: "#1e90ff" },
            { name: "Кибер-Глаз", color: "#00fa9a" },
            { name: "Абсолютный Хаос", color: "#ff8c00" },
            // Еще 30 скинов для полного комплекта до 50
            { name: "Кирпич-Одиночка", color: "#a0522d" },
            { name: "Кибер-Патч v1", color: "#008b8b" },
            { name: "Кибер-Патч v2", color: "#ff6347" },
            { name: "Кибер-Патч v3", color: "#4682b4" },
            { name: "Кислотный Дождь", color: "#adff2f" },
            { name: "Угольный Дм", color: "#1c1c1c" },
            { name: "Стальной Брат", color: "#708090" },
            { name: "Медный Бунт", color: "#cd7f32" },
            { name: "Неон-Шок", color: "#ff007f" },
            { name: "Плазменный Шар", color: "#00ffff" },
            { name: "Ядерный Пепел", color: "#696969" },
            { name: "Пустынный Клык", color: "#deb887" },
            { name: "Болотный Монстр", color: "#556b2f" },
            { name: "Морской Дьявол", color: "#000080" },
            { name: "Лиловый Угар", color: "#8a2be2" },
            { name: "Розовый Слон", color: "#ffb6c1" },
            { name: "Огненный Лис", color: "#ff4500" },
            { name: "Ледяная Глыба", color: "#afeeee" },
            { name: "Небесный Снаряд", color: "#87ceeb" },
            { name: "Звездная Пыль", color: "#dda0dd" },
            { name: "Мертвая Тишина", color: "#2f4f4f" },
            { name: "Дикий Запад", color: "#d2b48c" },
            { name: "Неоновый Тоннель", color: "#00ff7f" },
            { name: "Ретро-Волна", color: "#ff1493" },
            { name: "Аркадный Сбой", color: "#00ff00" },
            { name: "Темный Дворец", color: "#4b0082" },
            { name: "Золотая Лихорадка", color: "#daa520" },
            { name: "Серебряная Пуля", color: "#e0e0e0" },
            { name: "Бронзовый Век", color: "#cd853f" },
            { name: "Финал Нахуй", color: "#ffffff" }
        ];

        let currentSkinIndex = 0;
        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 5, y: 5};
        let obstacles = [{x: 7, y: 7}, {x: 7, y: 8}, {x: 15, y: 12}];
        let score = 0;
        let highScore = 0;
        let gameMode = 'play';
        let boss = null;
        let touchStartX = 0;
        let touchStartY = 0;

        function nextSkin() {
            currentSkinIndex = (currentSkinIndex + 1) % skins.length;
            skinNameDisplay.innerText = skins[currentSkinIndex].name;
            skinNameDisplay.style.color = skins[currentSkinIndex].color;
        }

        // Управление свайпами
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && velocity.x === 0) { velocity = {x: 1, y: 0}; }
                else if (dx < -30 && velocity.x === 0) { velocity = {x: -1, y: 0}; }
            } else {
                if (dy > 30 && velocity.y === 0) { velocity = {x: 0, y: 1}; }
                else if (dy < -30 && velocity.y === 0) { velocity = {x: 0, y: -1}; }
            }
        });

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': if(velocity.y === 0) velocity = {x:0, y:-1}; break;
                case 'ArrowDown': if(velocity.y === 0) velocity = {x:0, y:1}; break;
                case 'ArrowLeft': if(velocity.x === 0) velocity = {x:-1, y:0}; break;
                case 'ArrowRight': if(velocity.x === 0) velocity = {x:1, y:0}; break;
            }
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
        }

        function triggerBossFight() {
            gameMode = 'boss';
            bossHpBar.style.display = 'block';
            boss = { x: 10, y: 4, width: 3, height: 3, hp: 100, maxHp: 100, dir: 1 };
        }

        function update() {
            if (velocity.x === 0 && velocity.y === 0) return;

            let head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                resetGame();
                return;
            }

            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) { resetGame(); return; }
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) { resetGame(); return; }
            }

            snake.unshift(head);

            if (gameMode === 'play') {
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreVal.innerText = score;
                    spawnFood();
                    if (score >= 40 && score % 40 === 0) { triggerBossFight(); }
                } else {
                    snake.pop();
                }
            } else if (gameMode === 'boss' && boss) {
                boss.x += boss.dir * 0.4;
                if (boss.x <= 1 || boss.x >= tileCountX - 4) { boss.dir *= -1; }

                let hitBoss = false;
                for (let bx = Math.floor(boss.x); bx < Math.floor(boss.x) + boss.width; bx++) {
                    for (let by = boss.y; by < boss.y + boss.height; by++) {
                        if (head.x === bx && head.y === by) { hitBoss = true; }
                    }
                }

                if (hitBoss) {
                    boss.hp -= 25;
                    bossHpFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
                    snake.pop();

                    if (boss.hp <= 0) {
                        gameMode = 'play';
                        boss = null;
                        bossHpBar.style.display = 'none';
                        score += 100;
                        scoreVal.innerText = score;
                        spawnFood();
                    }
                } else {
                    if (head.x === food.x && head.y === food.y) {
                        score += 10;
                        scoreVal.innerText = score;
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }

            if (score > highScore) {
                highScore = score;
                highScoreVal.innerText = highScore;
            }
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Препятствия
            ctx.fillStyle = "#8b4513";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize - 1, gridSize - 1);
            }

            // Еда
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

            // Змейка текущим выбранным скином
            ctx.fillStyle = skins[currentSkinIndex].color;
            for (let part of snake) {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
            }

            // Босс
            if (gameMode === 'boss' && boss) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(boss.x * gridSize, boss.y * gridSize, boss.width * gridSize, boss.height * gridSize);
            }
        }

        function resetGame() {
            if (window.saveScore && score > 0) {
                window.saveScore("Игрок", score);
            }
            score = 0;
            scoreVal.innerText = score;
            snake = [{x: 10, y: 10}];
            velocity = {x: 0, y: 0};
            gameMode = 'play';
            boss = null;
            bossHpBar.style.display = 'none';
            spawnFood();
        }

        spawnFood();
        setInterval(() => {
            update();
            draw();
        }, 100);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Rewind</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background: #111; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 24px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        #game-container {
            position: relative;
            width: 360px; height: 450px;
            background: #1a1a1a;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            overflow: hidden;
        }
        canvas { display: block; background: #222; }
        .ui-panel {
            display: flex; justify-content: space-between;
            width: 360px; padding: 10px;
            background: #181818; font-size: 16px;
            font-weight: bold; border: 4px solid #333; border-top: none;
        }
        #boss-hp-bar {
            width: 100%; height: 8px; background: #444;
            margin-top: 5px; display: none; position: relative;
        }
        #boss-hp-fill {
            width: 100%; height: 100%; background: #ff0055;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

    <h1>SNAKE REWIND</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="450"></canvas>
    </div>
    <div class="ui-panel">
        <div>Счет: <span id="scoreVal">0</span></div>
        <div>Рекорд: <span id="highScoreVal">0</span></div>
    </div>
    <div style="width: 360px;" id="boss-hp-container">
        <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>

    <!-- Firebase интеграция -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDMInRuBDgKFRzj68br7C...",
        authDomain: "snake-rewind-11ee6.firebaseapp.com",
        projectId: "snake-rewind-11ee6",
        storageBucket: "snake-rewind-11ee6.firebasestorage.app",
        messagingSenderId: "786857506320",
        appId: "1:786857506320:web:55296c8798..."
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.saveScore = async function(playerName, score) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: playerName,
            score: score,
            date: new Date()
          });
          console.log("Рекорд успешно улетел в базу Zenith Storage!");
        } catch (e) {
          console.error("Ошибка сохранения рекорда: ", e);
        }
      };

      window.loadLeaderboard = async function() {
        try {
          const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
          const querySnapshot = await getDocs(q);
          let scores = [];
          querySnapshot.forEach((doc) => {
            scores.push(doc.data());
          });
          return scores;
        } catch (e) {
          console.error("Не удалось подтянуть данные: ", e);
          return [];
        }
      };
    </script>

    <!-- Основной движок игры и боссфайт -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreVal = document.getElementById("scoreVal");
        const highScoreVal = document.getElementById("highScoreVal");
        const bossHpBar = document.getElementById("boss-hp-bar");
        const bossHpFill = document.getElementById("boss-hp-fill");

        const gridSize = 15;
        const tileCountX = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        let snake = [{x: 12, y: 15}];
        let velocity = {x: 0, y: 0};
        let food = {x: 5, y: 5};
        let obstacles = [
            {x: 8, y: 8}, {x: 8, y: 9}, {x: 8, y: 10},
            {x: 20, y: 18}, {x: 21, y: 18}
        ];
        let score = 0;
        let highScore = 0;
        let gameMode = 'play'; 
        let boss = null;
        let touchStartX = 0;
        let touchStartY = 0;

        // Управление свайпами
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && velocity.x === 0) { velocity = {x: 1, y: 0}; }
                else if (dx < -30 && velocity.x === 0) { velocity = {x: -1, y: 0}; }
            } else {
                if (dy > 30 && velocity.y === 0) { velocity = {x: 0, y: 1}; }
                else if (dy < -30 && velocity.y === 0) { velocity = {x: 0, y: -1}; }
            }
        });

        // Клавиатура
        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': if(velocity.y === 0) velocity = {x:0, y:-1}; break;
                case 'ArrowDown': if(velocity.y === 0) velocity = {x:0, y:1}; break;
                case 'ArrowLeft': if(velocity.x === 0) velocity = {x:-1, y:0}; break;
                case 'ArrowRight': if(velocity.x === 0) velocity = {x:1, y:0}; break;
            }
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
        }

        function triggerBossFight() {
            gameMode = 'boss';
            bossHpBar.style.display = 'block';
            boss = {
                x: 12, y: 5,
                width: 3, height: 3,
                hp: 100, maxHp: 100,
                dir: 1
            };
        }

        function update() {
            if (velocity.x === 0 && velocity.y === 0) return;

            let head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                resetGame();
                return;
            }

            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) {
                    resetGame();
                    return;
                }
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);

            if (gameMode === 'play') {
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreVal.innerText = score;
                    spawnFood();

                    if (score >= 50 && score % 50 === 0) {
                        triggerBossFight();
                    }
                } else {
                    snake.pop();
                }
            } else if (gameMode === 'boss' && boss) {
                boss.x += boss.dir * 0.5;
                if (boss.x <= 2 || boss.x >= tileCountX - 5) {
                    boss.dir *= -1;
                }

                let hitBoss = false;
                for (let bx = Math.floor(boss.x); bx < Math.floor(boss.x) + boss.width; bx++) {
                    for (let by = boss.y; by < boss.y + boss.height; by++) {
                        if (head.x === bx && head.y === by) {
                            hitBoss = true;
                        }
                    }
                }

                if (hitBoss) {
                    boss.hp -= 20;
                    bossHpFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
                    snake.pop();

                    if (boss.hp <= 0) {
                        gameMode = 'play';
                        boss = null;
                        bossHpBar.style.display = 'none';
                        score += 100;
                        scoreVal.innerText = score;
                        spawnFood();
                    }
                } else {
                    if (head.x === food.x && head.y === food.y) {
                        score += 10;
                        scoreVal.innerText = score;
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }

            if (score > highScore) {
                highScore = score;
                highScoreVal.innerText = highScore;
            }
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#8b4513";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize - 1, gridSize - 1);
            }

            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

            ctx.fillStyle = "#00ffcc";
            for (let part of snake) {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
            }

            if (gameMode === 'boss' && boss) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(boss.x * gridSize, boss.y * gridSize, boss.width * gridSize, boss.height * gridSize);
            }
        }

        function resetGame() {
            if (window.saveScore && score > 0) {
                window.saveScore("Игрок", score);
            }
            score = 0;
            scoreVal.innerText = score;
            snake = [{x: 12, y: 15}];
            velocity = {x: 0, y: 0};
            gameMode = 'play';
            boss = null;
            bossHpBar.style.display = 'none';
            spawnFood();
        }

        spawnFood();
        setInterval(() => {
            update();
            draw();
        }, 100);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Rewind Revolution</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #00ffcc33;
            background: #080810;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
        canvas {
            background-color: #080810;
            display: block;
            touch-action: none;
        }
        .ui-panel {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            border-bottom: 1px solid #00ffcc22;
        }
        .bottom-panel {
            border-top: 1px solid #00ffcc22;
            border-bottom: none;
            justify-content: center;
            gap: 15px;
        }
        button {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        button:active {
            background: #00ffcc;
            color: #05050a;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 20px;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #00ffcc66;
        }
        .hidden {
            display: none !important;
        }
        #console-input {
            position: absolute;
            bottom: 10px;
            width: 90%;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            z-index: 20;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-panel">
        <span id="score-display">Счет: 0</span>
        <span id="level-display">Уровень: 1</span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="ui-panel bottom-panel">
        <button id="pause-btn">Пауза</button>
    </div>

    <div id="overlay">
        <h1>SNAKE REWIND</h1>
        <button id="start-btn">Играть</button>
        <button id="continue-btn" class="hidden">Продолжить</button>
    </div>

    <input type="text" id="console-input" class="hidden" placeholder="/console command...">
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = {};
    let dx = 1;
    let dy = 0;
    let score = 0;
    let level = 1;
    let gameInterval = null;
    let isPaused = false;
    let gameActive = false;
    let godMode = false;

    let currentSkin = 0;
    const skins = [
        { name: 'Neon', color: '#00ffcc' },
        { name: 'Fire', color: '#ff3300' }
    ];

    let lastDeathState = null;

    // Инициализация звука через Web Audio API
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq, type, duration) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playMusic(mood) {
        initAudio();
        if (mood === 'menu') {
            playTone(220, 'sine', 0.3);
        } else {
            playTone(440, 'triangle', 0.15);
        }
    }

    // Обновленная функция отрисовки фона с темами каждые 5 уровней
    function drawBackground() {
        let themeIndex = Math.floor((level - 1) / 5); 
        
        let bgColors = [
            '#080810', '#0a0514', '#051214', '#140808', '#081408', 
            '#141408', '#120514', '#050514', '#1f0c24', '#0c1f1a', '#240c0c'
        ];
        let gridColors = [
            'rgba(0, 255, 204, 0.15)',
            'rgba(255, 0, 150, 0.18)',
            'rgba(0, 200, 255, 0.2)',
            'rgba(255, 100, 0, 0.18)',
            'rgba(50, 255, 50, 0.18)',
            'rgba(255, 220, 0, 0.18)',
            'rgba(200, 0, 255, 0.18)',
            'rgba(0, 255, 255, 0.2)',
            'rgba(255, 0, 255, 0.2)',
            'rgba(0, 255, 128, 0.2)',
            'rgba(255, 50, 50, 0.2)'
        ];

        let curBg = bgColors[themeIndex % bgColors.length];
        let curGrid = gridColors[themeIndex % gridColors.length];

        ctx.fillStyle = curBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = curGrid;
        ctx.lineWidth = 1;

        for (let i = 0; i < TILE_COUNT; i++) {
            ctx.beginPath();
            ctx.moveTo(i * GRID_SIZE, 0);
            ctx.lineTo(i * GRID_SIZE, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i * GRID_SIZE);
            ctx.lineTo(canvas.width, i * GRID_SIZE);
            ctx.stroke();
        }
    }

    function saveProfileData() {
        localStorage.setItem('snake_save', JSON.stringify({ level, score }));
    }

    function initGame() {
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        spawnFood();
        score = 0;
        level = 1;
        dx = 1;
        dy = 0;
        updateUI();
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT),
            type: 'apple'
        };
    }

    function startGame() {
        initAudio();
        document.getElementById('overlay').classList.add('hidden');
        initGame();
        gameActive = true;
        isPaused = false;
        playMusic('game');
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 120);
    }

    function gameLoop() {
        if (isPaused || !gameActive) return;

        update();
        if (gameActive) {
            draw();
        }
    }

    function update() {
        let head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
            if (!godMode) {
                gameOver('wall');
                return;
            } else {
                if (head.x < 0) head.x = TILE_COUNT - 1;
                if (head.x >= TILE_COUNT) head.x = 0;
                if (head.y < 0) head.y = TILE_COUNT - 1;
                if (head.y >= TILE_COUNT) head.y = 0;
            }
        }

        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                if (!godMode) {
                    gameOver('self');
                    return;
                }
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            playTone(587.33, 'sine', 0.1);
            if (score % 50 === 0) {
                level++;
            }
            spawnFood();
            saveProfileData();
            updateUI();
        } else {
            snake.pop();
        }
    }

    function draw() {
        drawBackground();

        // Отрисовка еды
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);

        // Отрисовка змейки
        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = i === 0 ? '#ffffff' : skins[currentSkin].color;
            ctx.fillRect(snake[i].x * GRID_SIZE + 1, snake[i].y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
        }

        if (godMode) {
            ctx.fillStyle = "#ff0055";
            ctx.font = "10px 'Courier New'";
            ctx.fillText("GOD MODE", 30, 15);
        }
    }

    function gameOver(reason) {
        clearInterval(gameInterval);
        isPaused = true;
        playMusic('menu');

        localStorage.removeItem('snake_save');
        document.getElementById('continue-btn').classList.add('hidden');

        lastDeathState = {
            level: level,
            score: score,
            food: { ...food },
            bugs: JSON.parse(JSON.stringify(snake))
        };

        saveProfileData();
        document.getElementById('overlay').classList.remove('hidden');
        document.querySelector('#overlay h1').innerText = "ИГРА ОКОНЧЕНА";
    }

    function updateUI() {
        document.getElementById('score-display').innerText = `Счет: ${score}`;
        document.getElementById('level-display').innerText = `Уровень: ${level}`;
    }

    // Управление свайпами
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
        if (!gameActive || isPaused) return;
        let diffX = e.changedTouches[0].clientX - touchStartX;
        let diffY = e.changedTouches[0].clientY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 30 && dx === 0) { dx = 1; dy = 0; }
            else if (diffX < -30 && dx === 0) { dx = -1; dy = 0; }
        } else {
            if (diffY > 30 && dy === 0) { dx = 0; dy = 1; }
            else if (diffY < -30 && dy === 0) { dx = 0; dy = -1; }
        }
        e.preventDefault();
    }, {passive: false});

    // Обработка консоли через команду /console
    const consoleInput = document.getElementById('console-input');
    window.addEventListener('keydown', e => {
        if (e.key === '/') {
            consoleInput.classList.toggle('hidden');
            if (!consoleInput.classList.contains('hidden')) {
                consoleInput.focus();
                consoleInput.value = '';
            }
            e.preventDefault();
        } else if (e.key === 'Enter' && !consoleInput.classList.contains('hidden')) {
            let cmd = consoleInput.value.trim();
            if (cmd.startsWith('level ')) {
                let targetLvl = parseInt(cmd.split(' ')[1]);
                if (!isNaN(targetLvl)) {
                    level = targetLvl;
                    updateUI();
                }
            } else if (cmd === 'god') {
                godMode = !godMode;
            }
            consoleInput.classList.add('hidden');
            e.preventDefault();
        }
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('pause-btn').addEventListener('click', () => {
        if (!gameActive) return;
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "Продолжить" : "Пауза";
    });

    window.onload = function() {
        playMusic('menu');
        let saved = localStorage.getItem('snake_save');
        if (saved) {
            let data = JSON.parse(saved);
            level = data.level || 1;
            score = data.score || 0;
            updateUI();
            document.getElementById('continue-btn').classList.remove('hidden');
        }
    };
</script>
</body>
</html>

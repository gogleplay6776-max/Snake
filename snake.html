<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Rewind</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Стартовый экран */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #startTitle {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        canvas {
            border: 4px solid #ff5500;
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.4);
            background-color: #1a1a1a;
            max-width: 95vmin; 
            max-height: 65vh;
            display: block;
        }

        #scoreBoard {
            font-size: 16px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px #00ffcc;
            width: 95vmin;
            display: flex;
            justify-content: space-between;
        }
        
        .menu-btn {
            background: #1a1a1a;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 14px;
            padding: 10px 20px;
            margin-top: 6px;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 0 5px #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
            font-family: 'Courier New', Courier, monospace;
        }
        .menu-btn:active {
            background: #00ffcc;
            color: #000;
        }

        /* Общие модальные окна */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #skinList {
            width: 100%;
            max-width: 360px;
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 5px;
        }

        .skin-item {
            border: 2px solid #444;
            padding: 8px 12px;
            margin: 6px 0;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border-radius: 6px;
        }
        .skin-item.active {
            border-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Поле ввода читов */
        #cheatInput {
            background: #111;
            border: 2px solid #ff0055;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 10px;
            width: 80%;
            max-width: 320px;
            border-radius: 6px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(255,0,85,0.4);
            margin-bottom: 15px;
        }

        #cheatStatus {
            font-size: 13px;
            margin-top: 10px;
            height: 20px;
            text-shadow: 0 0 5px #fff;
        }

        /* Экран поражения / Босс-файта */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            display: none;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Стартовый экран -->
        <div id="startScreen">
            <div id="startTitle">SNAKE REWIND</div>
            <button class="menu-btn" style="font-size: 16px; padding: 12px 24px;" onclick="startGameFromMenu()">🎮 ИГРАТЬ В ЗМЕЙКУ</button>
        </div>

        <div id="scoreBoard">
            <span>УРОВЕНЬ: <span id="level">1</span></span>
            <span>СЧЕТ: <span id="score">0</span></span>
            <span>БАБЛО: <span id="money">0</span>$</span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div style="display: flex; gap: 10px;">
            <button class="menu-btn" onclick="openShop()">🛍️ МАГАЗИН</button>
            <button class="menu-btn" style="border-color: #ff0055; color: #ff0055;" onclick="openCheatModal()">⌨️ КОДЫ</button>
        </div>
        <div style="color: #666; font-size: 11px; margin-top: 4px;">УПРАВЛЕНИЕ: СВАЙПАЙ ПО ЭКРАНУ</div>

        <!-- Магазин скинов -->
        <div id="shopModal" class="modal">
            <h2 style="color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 10px;">ЭЛЕГАНТНЫЙ БУТИК</h2>
            <div id="skinList"></div>
            <button class="menu-btn" style="margin-top: 15px; border-color: #ff0055; color: #ff0055;" onclick="closeShop()">ЗАКРЫТЬ</button>
        </div>

        <!-- Меню чит-кодов (подсказки скрыты) -->
        <div id="cheatModal" class="modal">
            <h2 style="color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 10px;">КОНСОЛЬ ЧИТОВ</h2>
            <input type="text" id="cheatInput" placeholder="Введи команду..." autocomplete="off">
            <button class="menu-btn" onclick="executeCheat()">ВЫПОЛНИТЬ</button>
            <div id="cheatStatus"></div>
            <button class="menu-btn" style="margin-top: 25px; border-color: #777; color: #aaa;" onclick="closeCheatModal()">НАЗАД В ИГРУ</button>
        </div>

        <!-- Оверлей (Проигрыш / Босс / Возрождение) -->
        <div id="overlay">
            <div id="overlayTitle" style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">ТЫ ВРЕЗАЛСЯ В СТЕНУ, ТЫ ПРОИГРАЛ, ЛОХ</div>
            <div id="overlaySub" style="font-size: 14px; color: #fff; margin-bottom: 15px;">Счет: <span id="finalScore">0</span></div>
            <div id="reviveContainer"></div>
            <button id="overlayBtn" class="menu-btn" onclick="initGame()">ЗАНОВО С 1 УРОВНЯ</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelElement = document.getElementById('level');
    const scoreElement = document.getElementById('score');
    const moneyElement = document.getElementById('money');
    const finalScoreElement = document.getElementById('finalScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const overlayBtn = document.getElementById('overlayBtn');
    const reviveContainer = document.getElementById('reviveContainer');
    const startScreen = document.getElementById('startScreen');
    const shopModal = document.getElementById('shopModal');
    const cheatModal = document.getElementById('cheatModal');
    const skinList = document.getElementById('skinList');
    const cheatInput = document.getElementById('cheatInput');
    const cheatStatus = document.getElementById('cheatStatus');

    const gridSize = 20;
    const tileCount = 20;

    let score = 0;
    let level = 1;
    let foodEatenInLevel = 0;
    let money = parseInt(localStorage.getItem('zenith_money')) || 0;
    let snake = [];
    let food = { x: 0, y: 0, type: 'apple' };
    let obstacles = [];
    let bossActive = false;
    let bossHp = 10;
    let boss = { x: 10, y: 5, dx: 1 };
    let colorTimer = 0;

    let dx = 1;
    let dy = 0;
    
    let gameSpeed = 140;
    let gameInterval;
    let isGameOver = true;

    const skins = [
        { id: 'neon', name: '1. Неон (Базовый)', price: 0, color: '#00ffcc', headColor: '#66ffcc' },
        { id: 'gold', name: '2. Кибер-Золото', price: 10, color: '#ffcc00', headColor: '#ffee66' },
        { id: 'matrix', name: '3. Матрикс', price: 20, color: '#00ff00', headColor: '#66ff66' },
        { id: 'blood', name: '4. Кровавый Закат', price: 30, color: '#ff0055', headColor: '#ff6699' },
        { id: 'slime', name: '5. Ядовитый Слизь', price: 40, color: '#76ff03', headColor: '#b9f6ca' },
        { id: 'violet', name: '6. Панк Фиолет', price: 50, color: '#e040fb', headColor: '#ea80fc' },
        { id: 'ice', name: '7. Ледяной Кристалл', price: 60, color: '#00bcd4', headColor: '#84ffff' },
        { id: 'lemonade', name: '8. Кислотный Лимонад', price: 75, color: '#ffeb3b', headColor: '#fff59d' },
        { id: 'uranium', name: '9. Токсичный Уран', price: 90, color: '#cddc39', headColor: '#f4ff81' },
        { id: 'darkmatter', name: '10. Тёмная Материя', price: 110, color: '#78909c', headColor: '#b0bec5' },
        { id: 'dragon', name: '11. Золотой Дракон', price: 150, color: '#ff9800', headColor: '#ffe0b2' },
        { id: 'rainbow', name: '12. Радужный', price: 150, color: 'rainbow', headColor: 'rainbow' }
    ];

    let unlockedSkins = JSON.parse(localStorage.getItem('zenith_unlocked')) || ['neon'];
    let currentSkin = localStorage.getItem('zenith_current_skin') || 'neon';

    moneyElement.innerText = money;

    function startGameFromMenu() {
        startScreen.style.display = 'none';
        initGame();
    }

    function openShop() {
        isGameOver = true;
        clearInterval(gameInterval);
        renderShop();
        shopModal.style.display = 'flex';
    }

    function closeShop() {
        shopModal.style.display = 'none';
        initGame();
    }

    function openCheatModal() {
        isGameOver = true;
        clearInterval(gameInterval);
        cheatStatus.innerText = '';
        cheatInput.value = '';
        cheatModal.style.display = 'flex';
    }

    function closeCheatModal() {
        cheatModal.style.display = 'none';
        initGame();
    }

    function executeCheat() {
        const text = cheatInput.value.trim().toLowerCase();
        const parts = text.split(/\s+/);
        
        if (parts.length < 2) {
            cheatStatus.style.color = '#ff0055';
            cheatStatus.innerText = 'ОШИБКА: Неверный формат команды!';
            return;
        }

        const command = parts[0];
        const subCommand = parts[1];
        const value = parseInt(parts[2]);

        if (command === '/give' && subCommand === 'money') {
            if (isNaN(value)) {
                cheatStatus.style.color = '#ff0055';
                cheatStatus.innerText = 'ОШИБКА: Укажи число денег!';
                return;
            }
            money += value;
            moneyElement.innerText = money;
            localStorage.setItem('zenith_money', money);
            cheatStatus.style.color = '#00ffcc';
            cheatStatus.innerText = `УСПЕХ: Начислено ${value}$!`;
        } 
        else if (command === '/level') {
            const targetLevel = parseInt(subCommand);
            if (isNaN(targetLevel) || targetLevel < 1) {
                cheatStatus.style.color = '#ff0055';
                cheatStatus.innerText = 'ОШИБКА: Укажи нормальный уровень!';
                return;
            }
            level = targetLevel;
            levelElement.innerText = level;
            foodEatenInLevel = 0;
            cheatStatus.style.color = '#00ffcc';
            cheatStatus.innerText = `УСПЕХ: Телепорт на уровень ${level}!`;
            
            gameSpeed = Math.max(55, 140 - (level - 1) * 8);
            setTimeout(() => {
                setupLevel();
                cheatModal.style.display = 'none';
                startInterval();
            }, 800);
            return;
        } 
        else if (command === '/skin') {
            const skinIndex = parseInt(subCommand);
            if (isNaN(skinIndex) || skinIndex < 1 || skinIndex > skins.length) {
                cheatStatus.style.color = '#ff0055';
                cheatStatus.innerText = `ОШИБКА: Доступны скины от 1 до ${skins.length}!`;
                return;
            }
            const selectedSkin = skins[skinIndex - 1];
            
            if (!unlockedSkins.includes(selectedSkin.id)) {
                unlockedSkins.push(selectedSkin.id);
                localStorage.setItem('zenith_unlocked', JSON.stringify(unlockedSkins));
            }
            currentSkin = selectedSkin.id;
            localStorage.setItem('zenith_current_skin', currentSkin);

            cheatStatus.style.color = '#00ffcc';
            cheatStatus.innerText = `УСПЕХ: Надет скин №${skinIndex} (${selectedSkin.name})!`;
        } 
        else {
            cheatStatus.style.color = '#ff0055';
            cheatStatus.innerText = 'ОШИБКА: Неизвестная команда!';
        }
    }

    function renderShop() {
        skinList.innerHTML = '';
        skins.forEach((skin) => {
            const isUnlocked = unlockedSkins.includes(skin.id);
            const isActive = currentSkin === skin.id;

            const div = document.createElement('div');
            div.className = `skin-item ${isActive ? 'active' : ''}`;
            
            let actionBtn = '';
            if (isActive) {
                actionBtn = '<span style="color: #00ffcc; font-size: 13px;">АКТИВЕН</span>';
            } else if (isUnlocked) {
                actionBtn = `<button class="menu-btn" style="padding: 4px 8px; font-size: 11px; margin: 0;" onclick="selectSkin('${skin.id}')">НАДЕТЬ</button>`;
            } else {
                actionBtn = `<button class="menu-btn" style="padding: 4px 8px; font-size: 11px; margin: 0; border-color: #ffcc00; color: #ffcc00;" onclick="buySkin('${skin.id}', ${skin.price})">КУПИТЬ (${skin.price}$)</button>`;
            }

            div.innerHTML = `<span style="color: ${skin.color === 'rainbow' ? '#ff00ff' : skin.color}; font-size: 13px; font-weight: bold;">${skin.name}</span> ${actionBtn}`;
            skinList.appendChild(div);
        });
    }

    function buySkin(id, price) {
        if (money >= price) {
            money -= price;
            moneyElement.innerText = money;
            localStorage.setItem('zenith_money', money);
            unlockedSkins.push(id);
            localStorage.setItem('zenith_unlocked', JSON.stringify(unlockedSkins));
            currentSkin = id;
            localStorage.setItem('zenith_current_skin', currentSkin);
            renderShop();
        } else {
            alert('Мало бабла, блять! Используй секретный чит!');
        }
    }

    function selectSkin(id) {
        currentSkin = id;
        localStorage.setItem('zenith_current_skin', currentSkin);
        renderShop();
    }

    function getActiveSkinColors() {
        return skins.find(s => s.id === currentSkin) || skins[0];
    }

    function initGame() {
        startScreen.style.display = 'none';
        shopModal.style.display = 'none';
        cheatModal.style.display = 'none';
        overlay.style.display = 'none';
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        score = 0;
        level = 1;
        foodEatenInLevel = 0;
        dx = 1;
        dy = 0;
        gameSpeed = 140;
        isGameOver = false;
        scoreElement.innerText = score;
        levelElement.innerText = level;
        moneyElement.innerText = money;
        
        setupLevel();
        startInterval();
    }

    function startInterval() {
        clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, gameSpeed);
    }

    function gameLoop() {
        if (isGameOver) return;
        colorTimer += 0.2;
        update();
        draw();
    }

    function setupLevel() {
        obstacles = [];
        if (level % 5 === 0) {
            bossActive = true;
            bossHp = 10;
            boss.x = 8;
            boss.y = 8;
            boss.dx = 1;
            showBossIntro();
            return;
        }
        bossActive = false;
        let obstacleCount = Math.min(Math.floor(level / 2), 6);
        for (let i = 0; i < obstacleCount; i++) {
            let obs;
            do {
                obs = {
                    x: Math.floor(Math.random() * (tileCount - 4)) + 2,
                    y: Math.floor(Math.random() * (tileCount - 4)) + 2
                };
            } while (snake.some(p => p.x === obs.x && p.y === obs.y) || obstacles.some(o => o.x === obs.x && o.y === obs.y));
            obstacles.push(obs);
        }
        placeFood();
    }

    function showBossIntro() {
        clearInterval(gameInterval);
        overlayTitle.innerText = `⚠️ БОСС-ФАЙТ (УРОВЕНЬ ${level}) ⚠️`;
        overlaySub.innerText = `Уничтожь босса, съедая лимоны! Осталось HP: ${bossHp}`;
        reviveContainer.innerHTML = '';
        overlayBtn.innerText = "В БОЙ!";
        overlay.style.display = 'flex';
        isGameOver = true;
        placeFood();
    }

    function update() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver("ТЫ ВРЕЗАЛСЯ В СТЕНУ, ТЫ ПРОИГРАЛ, ЛОХ");
            return;
        }

        for (let i = 1; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                gameOver("ТЫ СОЖРАЛ СЕБЯ, ТЫ ПРОИГРАЛ, ЛОХ");
                return;
            }
        }

        for (let obs of obstacles) {
            if (obs.x === head.x && obs.y === head.y) {
                gameOver("ТЫ ВРЕЗАЛСЯ В БОЧКУ, ТЫ ПРОИГРАЛ, ЛОХ");
                return;
            }
        }

        if (bossActive) {
            boss.x += boss.dx;
            if (boss.x <= 1 || boss.x >= tileCount - 3) {
                boss.dx *= -1;
            }
            if (head.x >= boss.x && head.x <= boss.x + 1 && head.y >= boss.y && head.y <= boss.y + 1) {
                gameOver("ТЫ ВРЕЗАЛСЯ В БОССА, ТЫ ПРОИГРАЛ, ЛОХ");
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            let reward = (food.type === 'apple') ? 1 : (food.type === 'lemon') ? 2 : 3;
            money += reward;
            scoreElement.innerText = score;
            moneyElement.innerText = money;
            localStorage.setItem('zenith_money', money);

            if (bossActive) {
                bossHp--;
                if (bossHp <= 0) {
                    levelUp();
                } else {
                    placeFood();
                }
            } else {
                foodEatenInLevel++;
                if (foodEatenInLevel >= 5) {
                    levelUp();
                } else {
                    placeFood();
                }
            }
        } else {
            snake.pop();
        }
    }

    function levelUp() {
        level++;
        foodEatenInLevel = 0;
        levelElement.innerText = level;
        if (gameSpeed > 55) gameSpeed -= 8;
        setupLevel();
        startInterval();
    }

    function drawBrick(x, y, width, height) {
        ctx.fillStyle = '#b23b23';
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(x, y, width, 2);
        ctx.fillRect(x, y, 2, height);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(x, y + height - 2, width, 2);
        ctx.fillRect(x + width - 2, y, 2, height);
    }

    function drawFood() {
        let fx = food.x * gridSize;
        let fy = food.y * gridSize;

        if (food.type === 'apple') {
            ctx.fillStyle = '#ff0033';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0033';
            ctx.fillRect(fx + 3, fy + 3, gridSize - 6, gridSize - 6);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(fx + 9, fy + 1, 3, 3);
        } else if (food.type === 'lemon') {
            ctx.fillStyle = '#ffcc00';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffcc00';
            ctx.beginPath();
            ctx.arc(fx + gridSize/2, fy + gridSize/2, gridSize/2 - 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#66cc00';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#66cc00';
            ctx.fillRect(fx + 5, fy + 7, gridSize - 10, gridSize - 8);
            ctx.fillRect(fx + 7, fy + 3, gridSize - 14, 5);
        }
        ctx.shadowBlur = 0;
    }

    function draw() {
        ctx.fillStyle = '#1c1c1c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < tileCount; i++) {
            drawBrick(i * gridSize, 0, gridSize, gridSize);
            drawBrick(i * gridSize, (tileCount - 1) * gridSize, gridSize, gridSize);
            drawBrick(0, i * gridSize, gridSize, gridSize);
            drawBrick((tileCount - 1) * gridSize, i * gridSize, gridSize, gridSize);
        }

        if (bossActive) {
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(boss.x * gridSize, boss.y * gridSize, gridSize * 2, gridSize * 2);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Courier New';
            ctx.fillText(`HP:${bossHp}`, boss.x * gridSize + 4, boss.y * gridSize + 20);
            ctx.shadowBlur = 0;
        }

        obstacles.forEach(obs => {
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(obs.x * gridSize + 2, obs.y * gridSize + 2, gridSize - 4, gridSize - 4);
            ctx.fillStyle = '#ff5500';
            ctx.fillRect(obs.x * gridSize + 4, obs.y * gridSize + 8, gridSize - 8, 3);
        });

        drawFood();

        const skinColors = getActiveSkinColors();
        snake.forEach((part, index) => {
            if (skinColors.color === 'rainbow') {
                let hue = (colorTimer * 30 + index * 15) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                if (index === 0) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                } else {
                    ctx.shadowBlur = 0;
                }
            } else {
                if (index === 0) {
                    ctx.fillStyle = skinColors.headColor;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = skinColors.color;
                } else {
                    ctx.fillStyle = skinColors.color;
                    ctx.shadowBlur = 0;
                }
            }
            ctx.fillRect(part.x * gridSize + 2, part.y * gridSize + 2, gridSize - 4, gridSize - 4);
        });
        ctx.shadowBlur = 0;
    }

    function placeFood() {
        if (bossActive) {
            food.type = 'lemon';
        } else if (level % 3 === 0) {
            food.type = 'pear';
        } else {
            food.type = 'apple';
        }

        do {
            food.x = Math.floor(Math.random() * (tileCount - 2)) + 1;
            food.y = Math.floor(Math.random() * (tileCount - 2)) + 1;
        } while (
            snake.some(p => p.x === food.x && p.y === food.y) || 
            obstacles.some(o => o.x === food.x && o.y === food.y) ||
            (bossActive && food.x >= boss.x && food.x <= boss.x + 1 && food.y >= boss.y && food.y <= boss.y + 1)
        );
    }

    function gameOver(reason) {
        isGameOver = true;
        clearInterval(gameInterval);
        overlayTitle.innerText = reason;
        overlaySub.innerText = `Счет: ${score} | Уровень: ${level}`;
        
        reviveContainer.innerHTML = '';
        if (money >= 10) {
            reviveContainer.innerHTML = `<button class="menu-btn" style="border-color: #ffcc00; color: #ffcc00; margin-bottom: 10px;" onclick="reviveGame()">💳 КУПИТЬ СОХРАНЕНИЕ (10$)</button>`;
        }

        overlayBtn.innerText = "ЗАНОВО С 1 УРОВНЯ";
        overlay.style.display = 'flex';
    }

    function reviveGame() {
        money -= 10;
        moneyElement.innerText = money;
        localStorage.setItem('zenith_money', money);
        
        overlay.style.display = 'none';
        isGameOver = false;
        
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        dx = 1;
        dy = 0;
        placeFood();
        startInterval();
    }

    let touchStartX = 0;
    let touchStartY = 0;
    const minSwipeDistance = 30; 

    canvas.addEventListener('touchstart', (e) => {
        if (!isGameOver && shopModal.style.display !== 'flex' && cheatModal.style.display !== 'flex' && startScreen.style.display !== 'flex') {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
    }, false);

    canvas.addEventListener('touchend', (e) => {
        if (isGameOver || shopModal.style.display === 'flex' || cheatModal.style.display === 'flex' || startScreen.style.display === 'flex') return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (Math.abs(diffX) > minSwipeDistance) {
                if (diffX > 0 && dx !== -1) { dx = 1; dy = 0; }
                else if (diffX < 0 && dx !== 1) { dx = -1; dy = 0; }
            }
        } else {
            if (Math.abs(diffY) > minSwipeDistance) {
                if (diffY > 0 && dy !== -1) { dx = 0; dy = 1; }
                else if (diffY < 0 && dy !== -1) { dx = 0; dy = -1; }
            }
        }
        e.preventDefault();
    }, false);
</script>
</body>
</html>
